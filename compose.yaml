name: home-tunnel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: home_tunnel
      POSTGRES_USER: home_tunnel
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,nosuid,nodev,uid=999,gid=999,mode=0770
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U home_tunnel -d home_tunnel"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 768m
    cpus: "0.70"
    pids_limit: 256
    stop_grace_period: 45s
    logging: *default-logging

  control-center:
    image: home-tunnel/control-center:${HOME_TUNNEL_VERSION:-dev}
    build:
      context: ./control-center
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_BASE_URL: ${HOME_TUNNEL_PUBLIC_BASE_URL:?set HOME_TUNNEL_PUBLIC_BASE_URL in .env}
      DOWNLOADS_DIRECTORY: /app/downloads
      TUNNEL_DOMAIN: ${HOME_TUNNEL_TUNNEL_DOMAIN:?set HOME_TUNNEL_TUNNEL_DOMAIN in .env}
      PUBLIC_FRPS_HOST: ${HOME_TUNNEL_FRPS_PUBLIC_HOST:?set HOME_TUNNEL_FRPS_PUBLIC_HOST in .env}
      PUBLIC_FRPS_PORT: ${HOME_TUNNEL_FRPS_PORT:-7000}
      COOKIE_SECURE: "true"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: home_tunnel
      PGUSER: home_tunnel
      PGPASSWORD_FILE: /run/secrets/postgres_password
      INTERNAL_SERVICE_KEY_FILE: /run/secrets/internal_service_key
      FRPS_PLUGIN_KEY_FILE: /run/secrets/frps_plugin_key
      LEASE_SIGNING_KEY_FILE: /run/secrets/lease_signing_key
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      BOOTSTRAP_ADMIN_USERNAME: ${HOME_TUNNEL_BOOTSTRAP_ADMIN_USERNAME:-admin}
      GATEWAY_HEALTH_URL: http://traffic-gateway:8080/healthz
      FRPS_HOST: frps
      FRPS_PORT: "7000"
      CADDY_HOST: caddy
      CADDY_PORT: "80"
      BACKUP_STATUS_FILE: /run/home-tunnel-status/backup.json
    secrets:
      - postgres_password
      - internal_service_key
      - frps_plugin_key
      - lease_signing_key
      - bootstrap_admin_password
    volumes:
      - ./deploy/downloads:/app/downloads:ro
      - home-tunnel-status:/run/home-tunnel-status:ro
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    cpus: "0.55"
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging

  traffic-gateway:
    image: home-tunnel/traffic-gateway:${HOME_TUNNEL_VERSION:-dev}
    build:
      context: ./traffic-gateway
    restart: unless-stopped
    init: true
    depends_on:
      control-center:
        condition: service_healthy
      frps:
        condition: service_healthy
    environment:
      PORT: "8080"
      CONTROL_CENTER_URL: http://control-center:8080
      FRPS_VHOST_HOST: frps
      FRPS_VHOST_PORT: "8080"
      INTERNAL_SERVICE_KEY_FILE: /run/secrets/internal_service_key
      POLICY_POLL_MS: "1000"
      POLICY_FULL_SYNC_MS: "300000"
      SAMPLE_BUCKET_SECONDS: "10"
    secrets:
      - internal_service_key
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz',{headers:{host:'127.0.0.1:8080'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 384m
    cpus: "0.45"
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging

  frps:
    image: home-tunnel/frps:0.62.1
    build:
      context: ./deploy/frps
      args:
        FRP_VERSION: v0.62.1
    restart: unless-stopped
    init: true
    depends_on:
      control-center:
        condition: service_healthy
    ports:
      - "${HOME_TUNNEL_FRPS_BIND_ADDRESS:-0.0.0.0}:${HOME_TUNNEL_FRPS_PORT:-7000}:7000/tcp"
    secrets:
      - frps_plugin_key
    tmpfs:
      - /run/frp:size=16m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
      - /tmp:size=16m,noexec,nosuid,nodev
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 7000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    cpus: "0.30"
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      control-center:
        condition: service_healthy
      traffic-gateway:
        condition: service_healthy
    environment:
      HOME_TUNNEL_ACME_EMAIL: ${HOME_TUNNEL_ACME_EMAIL:?set HOME_TUNNEL_ACME_EMAIL in .env}
      HOME_TUNNEL_CONSOLE_HOST: ${HOME_TUNNEL_CONSOLE_HOST:?set HOME_TUNNEL_CONSOLE_HOST in .env}
      HOME_TUNNEL_TUNNEL_DOMAIN: ${HOME_TUNNEL_TUNNEL_DOMAIN:?set HOME_TUNNEL_TUNNEL_DOMAIN in .env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile.selfhost:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    networks: [control, edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: "0.30"
    pids_limit: 128
    logging: *default-logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  home-tunnel-status:

networks:
  control:
    internal: true
  edge:

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password
  internal_service_key:
    file: ./deploy/secrets/internal_service_key
  frps_plugin_key:
    file: ./deploy/secrets/frps_plugin_key
  lease_signing_key:
    file: ./deploy/secrets/lease_signing_key
  bootstrap_admin_password:
    file: ./deploy/secrets/bootstrap_admin_password
