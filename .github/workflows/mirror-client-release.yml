name: Mirror stable client release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable client version, for example 5.0.1
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: legacy-client-release-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Verify upstream artifacts and preserve the original updater entry point
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/mirror-client-release.py
