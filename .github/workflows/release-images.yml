name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  checks: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
      rc-version: ${{ steps.version.outputs.rc-version }}
      rc-tag: ${{ steps.version.outputs.rc-tag }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            stable=false
            base_version="${version%%-rc.*}"
            rc_version="$version"
            rc_tag="v$version"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
            base_version="$version"
            candidates=$(gh release list --limit 100 --json tagName,isPrerelease,isDraft,publishedAt \
              --jq '.[] | select(.isPrerelease and (.isDraft|not)) | .tagName' |
              grep -E "^v${version//./\.}-rc\.[0-9]+$" || true)
            rc_tag=$(printf '%s\n' "$candidates" | sort -V | tail -n 1)
            [ -n "$rc_tag" ] || { echo "Stable requires a published v$version-rc.N prerelease" >&2; exit 1; }
            rc_version="${rc_tag#v}"
          else
            echo "Unsupported release version: $version" >&2
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "$GITHUB_REF")
          test "$tag_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Release tags must identify a commit already merged into main.' >&2
            exit 1
          }
          if [ "$stable" = true ]; then
            git fetch --no-tags origin "refs/tags/$rc_tag:refs/tags/$rc_tag"
            rc_commit=$(git rev-list -n 1 "$rc_tag")
            release_target=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$rc_tag" --jq .target_commitish)
            if git rev-parse --verify "$release_target^{commit}" >/dev/null 2>&1; then
              release_commit=$(git rev-parse "$release_target^{commit}")
            else
              release_commit=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$release_target" --jq .sha)
            fi
            test "$rc_commit" = "$GITHUB_SHA" && test "$release_commit" = "$GITHUB_SHA" || {
              echo "RC tag, Stable tag, and RC Release target must resolve to the same commit" >&2
              exit 1
            }
          fi

          control_version=$(node -p "require('./control-center/package.json').version")
          gateway_version=$(node -p "require('./traffic-gateway/package.json').version")
          linux_version=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' linux-client/internal/model/model.go)
          android_version_name=$(sed -n 's/^HOME_TUNNEL_VERSION_NAME=//p' android-client/gradle.properties)
          android_version_code=$(sed -n 's/^HOME_TUNNEL_VERSION_CODE=//p' android-client/gradle.properties)
          android_agent_version=$(sed -n 's/^agent_version=//p' android-client/scripts/build-agent.sh)
          deployment_version=$(sed -n 's/^HOME_TUNNEL_VERSION=//p' .env.example)
          for candidate in "$control_version" "$gateway_version" "$linux_version" "$android_version_name" "$android_agent_version"; do
            test "$candidate" = "$base_version" || {
              echo "Tag $version does not match source version $candidate" >&2
              exit 1
            }
          done
          test "$deployment_version" = "$rc_version" || {
            echo "Deployment default $deployment_version must identify the promoted RC $rc_version" >&2
            exit 1
          }
          [[ "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          expected_android_code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          test "$android_version_code" -eq "$expected_android_code" || {
            echo "Android versionCode mismatch: expected $expected_android_code, found $android_version_code" >&2
            exit 1
          }
          frps_version=$(jq -r .version deploy/frps/dependency.json)
          frps_image=$(jq -r .image deploy/frps/dependency.json)
          frps_image_tag=$(jq -r .image_tag deploy/frps/dependency.json)
          frps_digest=$(jq -r .digest deploy/frps/dependency.json)
          frps_revision=$(jq -r .repository_revision deploy/frps/dependency.json)
          test "$frps_version" = 0.70.1
          test "$frps_image_tag" = 0.70.1-r2
          [[ "$frps_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$frps_revision" "$GITHUB_SHA"
          grep -Fq "$frps_image:$frps_image_tag@$frps_digest" compose.yaml
          {
            echo "version=$version"
            echo "base-version=$base_version"
            echo "rc-version=$rc_version"
            echo "rc-tag=$rc_tag"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

      - name: Require the tagged commit's full source quality matrix
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          check_runs=$(mktemp)
          page=1
          printf '[]' > "$check_runs"
          while :; do
            [ "$page" -le 100 ] || { echo 'Unexpectedly large check-run result set' >&2; exit 1; }
            response=$(mktemp)
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100&page=$page" > "$response"
            count=$(jq '.check_runs | length' "$response")
            jq -s '.[0] + .[1].check_runs' "$check_runs" "$response" > "$check_runs.next"
            mv "$check_runs.next" "$check_runs"
            [ "$count" -eq 100 ] || break
            page=$((page + 1))
          done
          required=(
            'Quality Gate'
            'Analyze (JavaScript and TypeScript)'
            'Analyze (Go Linux client)'
            'Analyze (Go Windows Agent)'
            'Analyze (C# Windows client)'
            'Analyze (Java/Kotlin Android client)'
            'Secret Scan'
            'Build and validate Pages'
          )
          for name in "${required[@]}"; do
            conclusion=$(jq -r --arg name "$name" \
              '[.[] | select(.name == $name and .app.slug == "github-actions")] |
               sort_by(.started_at, .id) | last | .conclusion // "missing"' "$check_runs")
            [ "$conclusion" = success ] || {
              echo "Latest GitHub Actions check for '$name' is not successful: $conclusion" >&2
              exit 1
            }
          done

  images:
    name: Image (${{ matrix.name }})
    if: needs.metadata.outputs.stable != 'true'
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-center
            context: ./control-center
            image: ghcr.io/zhanry/home-tunnel-control-center
          - name: traffic-gateway
            context: ./traffic-gateway
            image: ghcr.io/zhanry/home-tunnel-traffic-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ matrix.image }}:${{ needs.metadata.outputs.rc-version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.rc-version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Publish GitHub image attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign immutable image digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Write machine-readable digest record
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.metadata.outputs.rc-version }}
        run: |
          jq -n --arg name "$NAME" --arg image "$IMAGE" --arg digest "$DIGEST" \
            --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            '{name:$name,image:$image,digest:$digest,version:$version,revision:$revision}' > "image-$NAME.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: image-${{ matrix.name }}.json
          if-no-files-found: error

  agent-evidence:
    name: Windows x64 Experimental EXE and Agent evidence
    if: needs.metadata.outputs.stable != 'true'
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Install pinned windres (mingw binutils)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mingw-16.1.0.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'mingw-16.1.0'
          Invoke-WebRequest -Headers @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          } -Uri 'https://api.github.com/repos/niXman/mingw-builds-binaries/releases/assets/412720050' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'ecaceb42639d21c695f875800a29b2dea76bbb05eb2a1cca3049b65499b8d867'
          if ($actual -ne $expected) { throw "MinGW archive checksum mismatch: $actual" }
          & 7z x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'MinGW extraction failed' }
          $windres = Get-ChildItem -LiteralPath $extract -Recurse -Filter windres.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $windres) { throw 'windres.exe not found in the pinned MinGW archive' }
          "HOME_TUNNEL_WINDRES=$windres" >> $env:GITHUB_ENV
          $inno = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $inno) { throw 'Inno Setup 6 is missing from the runner image' }
          "HOME_TUNNEL_INNO=$inno" >> $env:GITHUB_ENV
      - id: agent
        name: Reproduce the reviewed Agent baseline
        shell: pwsh
        run: |
          $lines = & .\windows-client\build-agent.ps1 -WindRes $env:HOME_TUNNEL_WINDRES
          $lines | Write-Output
          $agentVersion = ($lines | Where-Object { $_ -like 'AGENT_VERSION=*' } | Select-Object -First 1) -replace '^AGENT_VERSION=', ''
          $frpVersion = ($lines | Where-Object { $_ -like 'FRP_VERSION=*' } | Select-Object -First 1) -replace '^FRP_VERSION=', ''
          $frpCommit = ($lines | Where-Object { $_ -like 'FRP_COMMIT=*' } | Select-Object -First 1) -replace '^FRP_COMMIT=', ''
          $sha = ($lines | Where-Object { $_ -like 'AGENT_SHA256=*' } | Select-Object -First 1) -replace '^AGENT_SHA256=', ''
          if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'Agent SHA-256 is missing' }
          [xml]$project = Get-Content -LiteralPath .\windows-client\HomeTunnel.Client.csproj
          $expectedSha = ($project.Project.PropertyGroup.AgentExpectedSha256 | Where-Object { $_ } | Select-Object -First 1).InnerText
          if ($sha -ne $expectedSha) { throw "Agent baseline hash mismatch: built=$sha expected=$expectedSha" }
          "agent_version=$agentVersion" >> $env:GITHUB_OUTPUT
          "frp_version=$frpVersion" >> $env:GITHUB_OUTPUT
          "frp_commit=$frpCommit" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
      - name: Write protected build evidence
        shell: pwsh
        env:
          AGENT_VERSION: ${{ steps.agent.outputs.agent_version }}
          FRP_VERSION: ${{ steps.agent.outputs.frp_version }}
          FRP_COMMIT: ${{ steps.agent.outputs.frp_commit }}
          AGENT_SHA256: ${{ steps.agent.outputs.sha256 }}
        run: |
          $evidence = [ordered]@{
            schema_version = 1
            agent_version = $env:AGENT_VERSION
            frp_version = $env:FRP_VERSION
            frp_commit = $env:FRP_COMMIT
            sha256 = $env:AGENT_SHA256
            repository_revision = $env:GITHUB_SHA
            build_identity = "https://github.com/$env:GITHUB_REPOSITORY/.github/workflows/release-images.yml@refs/tags/$env:GITHUB_REF_NAME"
            distribution = "bundled in the Windows x64 Experimental EXE"
            authenticode = "ephemeral self-signed; Windows may show unknown publisher"
          }
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'windows-agent-provenance.json'),
            ($evidence | ConvertTo-Json -Depth 3) + "`n",
            [Text.UTF8Encoding]::new($false)
          )
      - id: windows
        name: Build, scan, install, and uninstall the Experimental EXE
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.base-version }}
        run: |
          $lines = & .\windows-client\packaging\build-exe.ps1 -Version $env:VERSION -WindRes $env:HOME_TUNNEL_WINDRES -InnoCompiler $env:HOME_TUNNEL_INNO
          $lines | Write-Output
          $installer = ($lines | Where-Object { $_ -like 'EXE=*' } |
            Select-Object -First 1) -replace '^EXE=', ''
          $sha = ($lines | Where-Object { $_ -like 'EXE_SHA256=*' } |
            Select-Object -First 1) -replace '^EXE_SHA256=', ''
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or
              $sha -notmatch '^[0-9a-f]{64}$') {
            throw 'Windows EXE output or SHA-256 is missing'
          }
          $fileName = Split-Path -Leaf $installer
          [IO.File]::WriteAllText(
            "$installer.sha256",
            "$sha  $fileName" + [char]10,
            [Text.UTF8Encoding]::new($false)
          )
          $metadata = Get-Content -Raw -LiteralPath outputs\windows\latest.json |
            ConvertFrom-Json
          if ($metadata.version -ne $env:VERSION -or
              $metadata.sha256 -ne $sha -or
              $metadata.signature_trust -ne 'untrusted-self-signed') {
            throw 'Windows update manifest does not match the built EXE'
          }
          $test = & .\windows-client\packaging\test-exe.ps1 -Installer $installer
          if ($test.Install -ne 'passed' -or -not $test.Uninstalled) {
            throw 'Windows installer smoke did not complete'
          }
          $smoke = [ordered]@{
            schema_version = 1
            status = 'passed'
            version = $env:VERSION
            platform = 'windows'
            architecture = 'x64'
            installer_sha256 = $sha
            install = $test.Install
            product_version = $test.ProductVersion
            agent_version = $test.AgentVersion
            file_count = $test.FileCount
            uninstalled = $test.Uninstalled
            signature_trust = 'untrusted-self-signed'
            repository_revision = $env:GITHUB_SHA
          }
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'windows-exe-smoke.json'),
            ($smoke | ConvertTo-Json -Depth 3) + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "checksum=$installer.sha256" >> $env:GITHUB_OUTPUT
          "sbom=$installer.spdx.json" >> $env:GITHUB_OUTPUT
      - name: Generate Windows SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: outputs/windows
          format: spdx-json
          output-file: ${{ steps.windows.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign Windows package evidence
        shell: pwsh
        env:
          INSTALLER: ${{ steps.windows.outputs.installer }}
          CHECKSUM: ${{ steps.windows.outputs.checksum }}
          SBOM: ${{ steps.windows.outputs.sbom }}
        run: |
          cosign sign-blob --yes --bundle windows-agent-provenance.json.sigstore.json windows-agent-provenance.json
          foreach ($subject in @($env:INSTALLER, $env:CHECKSUM, $env:SBOM)) {
            cosign sign-blob --yes --bundle "$subject.sigstore.json" "$subject"
            if ($LASTEXITCODE -ne 0) { throw "Sigstore signing failed for $subject" }
          }
      - name: Attest the reproduced Agent executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: windows-client/assets/HomeTunnel.Agent.exe
      - name: Attest the public Agent evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: windows-agent-provenance.json
      - name: Publish GitHub Windows EXE provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.windows.outputs.installer }}
      - name: Publish GitHub Windows EXE SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.windows.outputs.installer }}
          sbom-path: ${{ steps.windows.outputs.sbom }}
      - name: Stage the public Windows asset set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-windows | Out-Null
          Get-ChildItem -LiteralPath outputs\windows -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Copy-Item -Destination release-windows
          Copy-Item windows-exe-smoke.json, windows-agent-provenance.json, windows-agent-provenance.json.sigstore.json release-windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: release-windows/*
          if-no-files-found: error

  android-package:
    name: Android 8+ arm64 Experimental APK and AAB
    if: needs.metadata.outputs.stable != 'true'
    needs: metadata
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the pinned Gradle wrapper
        run: |
          set -euo pipefail
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  android-client/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          grep -Fxq 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' android-client/gradle/wrapper/gradle-wrapper.properties
          grep -Fxq 'distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' android-client/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - id: android-agent
        name: Build the embedded arm64 Android Agent
        working-directory: android-client
        env:
          ANDROID_AGENT_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          evidence=$(mktemp)
          ./scripts/build-agent.sh | tee "$evidence"
          agent=app/src/main/jniLibs/arm64-v8a/libhometunnel_agent.so
          test -s "$agent"
          reported_abi=$(sed -n 's/^ANDROID_AGENT_ABI=//p' "$evidence")
          reported_sha=$(sed -n 's/^ANDROID_AGENT_SHA256=//p' "$evidence")
          test "$reported_abi" = arm64-v8a
          [[ "$reported_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$agent" | awk '{print $1}')" = "$reported_sha"
          native_outputs=$(find app/src/main/jniLibs -type f -name libhometunnel_agent.so -printf '%P\n' | sort)
          test "$native_outputs" = arm64-v8a/libhometunnel_agent.so
          {
            echo "sha256=$reported_sha"
            echo "path=$PWD/$agent"
          } >> "$GITHUB_OUTPUT"
      - id: android
        name: Build the persistently signed Android release packages
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.base-version }}
          # Keep Gradle's ABI filter aligned with the Agent build step. Without
          # this, transitive native libraries can add an unusable x86_64 split
          # even though the Experimental release packages only the arm64 Agent.
          ANDROID_AGENT_ABIS: arm64-v8a
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            test -n "${!secret_name:-}" || {
              echo "Protected Android signing secret is missing: $secret_name" >&2
              exit 1
            }
          done
          test -s android-client/release-signing-cert.sha256 || {
            echo 'The reviewed Android release certificate fingerprint is missing.' >&2
            exit 1
          }
          keystore="$RUNNER_TEMP/home-tunnel-android-release.p12"
          umask 077
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export ANDROID_RELEASE_STORE_FILE="$keystore"
          (
            cd android-client
            ./gradlew --no-daemon clean test lint assembleRelease bundleRelease
          )
          source_apk=android-client/app/build/outputs/apk/release/app-release.apk
          source_aab=android-client/app/build/outputs/bundle/release/app-release.aab
          test -s "$source_apk" && test -s "$source_aab" || {
            echo 'Signed Android APK or AAB output is missing; unsigned output is never accepted.' >&2
            exit 1
          }
          mkdir release-android
          apk="$PWD/release-android/HomeTunnel-Android-$VERSION-arm64-v8a.apk"
          aab="$PWD/release-android/HomeTunnel-Android-$VERSION.aab"
          cp "$source_apk" "$apk"
          cp "$source_aab" "$aab"
          {
            echo "apk=$apk"
            echo "aab=$aab"
            echo "apk-sbom=$apk.spdx.json"
            echo "aab-sbom=$aab.spdx.json"
            echo "evidence=$PWD/release-android/android-release-evidence.json"
          } >> "$GITHUB_OUTPUT"
      - id: android-verify
        name: Verify package identity, version, ABI, and persistent signer
        shell: bash
        env:
          APK: ${{ steps.android.outputs.apk }}
          AAB: ${{ steps.android.outputs.aab }}
          EVIDENCE: ${{ steps.android.outputs.evidence }}
          VERSION: ${{ needs.metadata.outputs.base-version }}
          AGENT_SHA256: ${{ steps.android-agent.outputs.sha256 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          expected_code=$(sed -n 's/^HOME_TUNNEL_VERSION_CODE=//p' android-client/gradle.properties)
          expected_cert=$(tr -d '[:space:]:' < android-client/release-signing-cert.sha256 | tr 'A-F' 'a-f')
          [[ "$expected_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]]

          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          test -d "$sdk_root"
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          apkanalyzer=$(command -v apkanalyzer || find "$sdk_root/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort -V | tail -n 1)
          test -x "$apksigner" && test -x "$apkanalyzer"
          apk_signature=$($apksigner verify --verbose --print-certs "$APK")
          printf '%s\n' "$apk_signature"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$apk_signature"
          apk_cert=$(sed -nE \
            -e 's/^Signer #1 certificate SHA-256 digest: //p' \
            -e 's/^V[0-9.]+ Signer: certificate SHA-256 digest: //p' \
            <<< "$apk_signature" | tr 'A-F' 'a-f' | sort -u | tr -d '[:space:]:' )
          [[ "$apk_cert" =~ ^[0-9a-f]{64}$ ]]
          test "$apk_cert" = "$expected_cert"
          test "$($apkanalyzer manifest application-id "$APK")" = io.github.zhanry.hometunnel
          test "$($apkanalyzer manifest version-name "$APK")" = "$VERSION"
          test "$($apkanalyzer manifest version-code "$APK")" = "$expected_code"
          min_sdk=$($apkanalyzer manifest min-sdk "$APK")
          target_sdk=$($apkanalyzer manifest target-sdk "$APK")
          test "$min_sdk" -eq 26
          test "$target_sdk" -ge 35
          apk_abis=$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          test "$apk_abis" = arm64-v8a
          unzip -Z1 "$APK" | grep -Fxq lib/arm64-v8a/libhometunnel_agent.so
          apk_agent_sha=$(unzip -p "$APK" lib/arm64-v8a/libhometunnel_agent.so | sha256sum | awk '{print $1}')
          test "$apk_agent_sha" = "$AGENT_SHA256"

          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$bundletool"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$bundletool" | sha256sum -c -
          java -jar "$bundletool" validate --bundle="$AAB"
          aab_signature=$(jarsigner -verify -verbose -certs "$AAB" 2>&1)
          grep -Fq 'jar verified.' <<< "$aab_signature"
          aab_cert=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          test "$aab_cert" = "$expected_cert"
          test "$(java -jar "$bundletool" dump manifest --bundle="$AAB" --xpath=/manifest/@package)" = io.github.zhanry.hometunnel
          test "$(java -jar "$bundletool" dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionName)" = "$VERSION"
          test "$(java -jar "$bundletool" dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionCode)" = "$expected_code"
          aab_abis=$(unzip -Z1 "$AAB" | sed -n 's#^base/lib/\([^/]*\)/.*#\1#p' | sort -u)
          test "$aab_abis" = arm64-v8a
          unzip -Z1 "$AAB" | grep -Fxq base/lib/arm64-v8a/libhometunnel_agent.so
          aab_agent_sha=$(unzip -p "$AAB" base/lib/arm64-v8a/libhometunnel_agent.so | sha256sum | awk '{print $1}')
          test "$aab_agent_sha" = "$AGENT_SHA256"

          apk_sha=$(sha256sum "$APK" | awk '{print $1}')
          aab_sha=$(sha256sum "$AAB" | awk '{print $1}')
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          (cd "$(dirname "$AAB")" && sha256sum "$(basename "$AAB")" > "$(basename "$AAB").sha256")
          jq -n \
            --arg version "$VERSION" \
            --argjson version_code "$expected_code" \
            --argjson min_sdk "$min_sdk" \
            --argjson target_sdk "$target_sdk" \
            --arg apk_sha256 "$apk_sha" \
            --arg aab_sha256 "$aab_sha" \
            --arg agent_sha256 "$AGENT_SHA256" \
            --arg signing_certificate_sha256 "$expected_cert" \
            --arg revision "$GITHUB_SHA" \
            --arg build_identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-images.yml@refs/tags/$GITHUB_REF_NAME" \
            '{schema_version:1,status:"passed",release_channel:"experimental",
              platform:"android",application_id:"io.github.zhanry.hometunnel",
              version_name:$version,version_code:$version_code,min_sdk:$min_sdk,target_sdk:$target_sdk,
              abis:["arm64-v8a"],apk_sha256:$apk_sha256,aab_sha256:$aab_sha256,
              agent_sha256:$agent_sha256,signing_certificate_sha256:$signing_certificate_sha256,
              repository_revision:$revision,build_identity:$build_identity,
              validations:["unit_tests","lint","apk_signature_v2","aab_signature","bundletool_validate","package_identity","version","arm64_abi","embedded_agent_hash"],
              physical_arm64_install:"not_run_in_github_actions"}' > "$EVIDENCE"
      - id: android-syft
        name: Install the pinned Android SBOM scanner
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3
      - name: Generate per-package Android SPDX SBOMs
        shell: bash
        env:
          SYFT: ${{ steps.android-syft.outputs.cmd }}
          APK: ${{ steps.android.outputs.apk }}
          AAB: ${{ steps.android.outputs.aab }}
          APK_SBOM: ${{ steps.android.outputs.apk-sbom }}
          AAB_SBOM: ${{ steps.android.outputs.aab-sbom }}
        run: |
          set -euo pipefail
          "$SYFT" scan "file:$APK" -o spdx-json > "$APK_SBOM"
          "$SYFT" scan "file:$AAB" -o spdx-json > "$AAB_SBOM"
          test -s "$APK_SBOM" && test -s "$AAB_SBOM"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign the Android package and evidence set
        shell: bash
        env:
          APK: ${{ steps.android.outputs.apk }}
          AAB: ${{ steps.android.outputs.aab }}
          APK_SBOM: ${{ steps.android.outputs.apk-sbom }}
          AAB_SBOM: ${{ steps.android.outputs.aab-sbom }}
          EVIDENCE: ${{ steps.android.outputs.evidence }}
        run: |
          set -euo pipefail
          for subject in "$APK" "$APK.sha256" "$APK_SBOM" "$AAB" "$AAB.sha256" "$AAB_SBOM" "$EVIDENCE"; do
            test -s "$subject"
            cosign sign-blob --yes --bundle "$subject.sigstore.json" "$subject"
          done
      - name: Publish GitHub Android APK provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.android.outputs.apk }}
      - name: Publish GitHub Android APK SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.android.outputs.apk }}
          sbom-path: ${{ steps.android.outputs.apk-sbom }}
      - name: Publish GitHub Android AAB provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.android.outputs.aab }}
      - name: Publish GitHub Android AAB SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.android.outputs.aab }}
          sbom-path: ${{ steps.android.outputs.aab-sbom }}
      - name: Attest the Android release evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.android.outputs.evidence }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: release-android/*
          if-no-files-found: error

  client-packages:
    name: Client package (${{ matrix.platform }}-${{ matrix.arch }})
    if: needs.metadata.outputs.stable != 'true'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            script: ./linux-client/packaging/build-release.sh
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            script: ./linux-client/packaging/build-release.sh
          - platform: macos
            arch: amd64
            runner: macos-latest
            script: ./linux-client/packaging/macos/build-release.sh
          - platform: macos
            arch: arm64
            runner: macos-latest
            script: ./linux-client/packaging/macos/build-release.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: linux-client/go.mod
      - name: Build package once from the tagged commit
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.rc-version }}
          ARCH: ${{ matrix.arch }}
        run: ${{ matrix.script }}
      - id: artifact
        name: Verify package layout and select outputs
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.metadata.outputs.rc-version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive="outputs/$PLATFORM/home-tunnel-$PLATFORM-$VERSION-$ARCH.tar.gz"
          checksum="outputs/$PLATFORM/home-tunnel-$PLATFORM-$VERSION-$ARCH.sha256"
          test -s "$archive" && test -s "$checksum"
          (cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$checksum")")
          listing=$(tar -tzf "$archive")
          grep -q '/bin/home-tunnel-client$' <<< "$listing"
          grep -q '/lib/home-tunnel-agent$' <<< "$listing"
          if [ "$PLATFORM" = linux ]; then
            grep -q '/lib/systemd/system/home-tunnel-client.service$' <<< "$listing"
          else
            grep -q '/Library/LaunchDaemons/com.hometunnel.client.plist$' <<< "$listing"
          fi
          mkdir -p package-scan
          tar -xzf "$archive" -C package-scan
          {
            echo "archive=$archive"
            echo "checksum=$checksum"
            echo "sbom=$archive.spdx.json"
          } >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: package-scan
          format: spdx-json
          output-file: ${{ steps.artifact.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign package, checksum, and SBOM
        shell: bash
        env:
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          SBOM: ${{ steps.artifact.outputs.sbom }}
        run: |
          set -euo pipefail
          for subject in "$ARCHIVE" "$CHECKSUM" "$SBOM"; do
            cosign sign-blob --yes --bundle "$subject.sigstore.json" "$subject"
          done
      - name: Publish GitHub package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
      - name: Publish GitHub package SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: ${{ steps.artifact.outputs.sbom }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ steps.artifact.outputs.archive }}
            ${{ steps.artifact.outputs.checksum }}
            ${{ steps.artifact.outputs.sbom }}
            ${{ steps.artifact.outputs.archive }}.sigstore.json
            ${{ steps.artifact.outputs.checksum }}.sigstore.json
            ${{ steps.artifact.outputs.sbom }}.sigstore.json
          if-no-files-found: error

  rc-assets:
    name: Assemble RC assets and digest manifest
    if: needs.metadata.outputs.stable != 'true'
    needs: [metadata, images, agent-evidence, android-package, client-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: client-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: image-records
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release
          path: release
      - name: Verify complete matrices and write manifests
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.rc-version }}
          BASE_VERSION: ${{ needs.metadata.outputs.base-version }}
        run: |
          set -euo pipefail
          for platform in linux macos; do
            for arch in amd64 arm64; do
              prefix="release/home-tunnel-$platform-$VERSION-$arch"
              test -s "$prefix.tar.gz"
              test -s "$prefix.sha256"
              test -s "$prefix.tar.gz.spdx.json"
              test -s "$prefix.tar.gz.sigstore.json"
              test -s "$prefix.sha256.sigstore.json"
              test -s "$prefix.tar.gz.spdx.json.sigstore.json"
              (cd release && shasum -a 256 -c "home-tunnel-$platform-$VERSION-$arch.sha256")
            done
          done
          jq -s --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            --slurpfile frps deploy/frps/dependency.json \
            '{schema_version:2,version:$version,revision:$revision,
              images:(map({key:.name,value:{image:.image,digest:.digest}})|from_entries),
              dependencies:{frps:$frps[0]}}' \
            image-records/image-*.json > release/image-digests.json
          cp deploy/frps/dependency.json release/frps-dependency.json
          windows_exe="release/HomeTunnel-Setup-$BASE_VERSION-x64.exe"
          test -s "$windows_exe"
          test -s "$windows_exe.sha256"
          test -s "$windows_exe.spdx.json"
          test -s "$windows_exe.sigstore.json"
          test -s "$windows_exe.sha256.sigstore.json"
          test -s "$windows_exe.spdx.json.sigstore.json"
          (cd release && sha256sum -c "HomeTunnel-Setup-$BASE_VERSION-x64.exe.sha256")
          for support in HomeTunnel-Internal-Code-Signing.cer latest.json README-EXE.txt SIGNATURE.txt windows-exe-smoke.json; do
            test -s "release/$support"
          done
          test -s release/windows-agent-provenance.json
          test -s release/windows-agent-provenance.json.sigstore.json
          jq -e --arg version "$BASE_VERSION" '.agent_version == $version and .frp_version == "0.70.1" and
            .frp_commit == "fa3bcca2b0c4753cd4f0e2ab189dd6a5a6a15708" and
            (.sha256 | test("^[0-9a-f]{64}$"))' release/windows-agent-provenance.json >/dev/null
          exe_sha=$(sha256sum "$windows_exe" | awk '{print $1}')
          jq -e --arg version "$BASE_VERSION" --arg sha "$exe_sha" '
            .version == $version and .platform == "windows" and .architecture == "x64" and
            .sha256 == $sha and .release_channel == "experimental" and
            .signature_trust == "untrusted-self-signed"' release/latest.json >/dev/null
          jq -e --arg version "$BASE_VERSION" --arg sha "$exe_sha" '
            .status == "passed" and .version == $version and .installer_sha256 == $sha and
            .install == "passed" and .uninstalled == true and
            (.agent_version | startswith("Home Tunnel Agent " + $version)) and
            .signature_trust == "untrusted-self-signed"' release/windows-exe-smoke.json >/dev/null
          android_apk="release/HomeTunnel-Android-$BASE_VERSION-arm64-v8a.apk"
          android_aab="release/HomeTunnel-Android-$BASE_VERSION.aab"
          for subject in "$android_apk" "$android_aab"; do
            test -s "$subject"
            test -s "$subject.sha256"
            test -s "$subject.spdx.json"
            test -s "$subject.sigstore.json"
            test -s "$subject.sha256.sigstore.json"
            test -s "$subject.spdx.json.sigstore.json"
            (cd release && sha256sum -c "$(basename "$subject").sha256")
          done
          test -s release/android-release-evidence.json
          test -s release/android-release-evidence.json.sigstore.json
          android_apk_sha=$(sha256sum "$android_apk" | awk '{print $1}')
          android_aab_sha=$(sha256sum "$android_aab" | awk '{print $1}')
          android_apk_agent_sha=$(unzip -p "$android_apk" lib/arm64-v8a/libhometunnel_agent.so | sha256sum | awk '{print $1}')
          android_aab_agent_sha=$(unzip -p "$android_aab" base/lib/arm64-v8a/libhometunnel_agent.so | sha256sum | awk '{print $1}')
          test "$android_apk_agent_sha" = "$android_aab_agent_sha"
          android_version_code=$(sed -n 's/^HOME_TUNNEL_VERSION_CODE=//p' android-client/gradle.properties)
          android_cert=$(tr -d '[:space:]:' < android-client/release-signing-cert.sha256 | tr 'A-F' 'a-f')
          jq -e --arg version "$BASE_VERSION" --argjson version_code "$android_version_code" --arg apk_sha "$android_apk_sha" \
            --arg aab_sha "$android_aab_sha" --arg agent_sha "$android_apk_agent_sha" \
            --arg cert "$android_cert" --arg revision "$GITHUB_SHA" '
            .status == "passed" and .release_channel == "experimental" and
            .platform == "android" and .application_id == "io.github.zhanry.hometunnel" and
            .version_name == $version and .version_code == $version_code and .min_sdk == 26 and
            .target_sdk >= 35 and .abis == ["arm64-v8a"] and
            .apk_sha256 == $apk_sha and .aab_sha256 == $aab_sha and
            .agent_sha256 == $agent_sha and
            .signing_certificate_sha256 == $cert and .repository_revision == $revision and
            (.validations | index("embedded_agent_hash")) and
            .physical_arm64_install == "not_run_in_github_actions"' \
            release/android-release-evidence.json >/dev/null
          test "$(jq '.images | length' release/image-digests.json)" -eq 2
          jq -e '.images["control-center"].digest | test("^sha256:[0-9a-f]{64}$")' release/image-digests.json >/dev/null
          jq -e '.images["traffic-gateway"].digest | test("^sha256:[0-9a-f]{64}$")' release/image-digests.json >/dev/null
          jq -e '.dependencies.frps.version == "0.70.1" and
            .dependencies.frps.image_tag == "0.70.1-r2" and
            (.dependencies.frps.digest | test("^sha256:[0-9a-f]{64}$"))' release/image-digests.json >/dev/null
          cmp -s deploy/frps/dependency.json release/frps-dependency.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the immutable image digest manifest
        run: cosign sign-blob --yes --bundle release/image-digests.json.sigstore.json release/image-digests.json
      - name: Attest the immutable image digest manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/image-digests.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-release-assets
          path: release
          if-no-files-found: error

  release-smoke:
    name: Release smoke (immutable RC artifacts)
    if: needs.metadata.outputs.stable != 'true'
    needs: [metadata, rc-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rc-release-assets
          path: release
      - name: Pull the exact image manifests and run production-path smoke
        shell: bash
        env:
          RC_VERSION: ${{ needs.metadata.outputs.rc-version }}
        run: |
          set -euo pipefail
          CONTROL_IMAGE="$(jq -r '.images["control-center"] | .image + "@" + .digest' release/image-digests.json)"
          GATEWAY_IMAGE="$(jq -r '.images["traffic-gateway"] | .image + "@" + .digest' release/image-digests.json)"
          FRPS_IMAGE="$(jq -r '.dependencies.frps | .image + "@" + .digest' release/image-digests.json)"
          export CONTROL_IMAGE GATEWAY_IMAGE FRPS_IMAGE
          docker pull "$CONTROL_IMAGE"
          docker pull "$GATEWAY_IMAGE"
          docker pull "$FRPS_IMAGE"
          bash tests/run-release-smoke.sh
      - name: Add release-smoke evidence to the RC asset set
        run: cp release-smoke-evidence/* release/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Seal the complete RC asset and evidence set
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            # Seal every already-produced asset, including the individual
            # Sigstore bundles. Only the aggregate manifest and its bundle are
            # necessarily created after this list, avoiding a circular hash.
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS.txt' \
              ! -name 'SHA256SUMS.txt.sigstore.json' -printf '%f\0' |
              sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
          cosign sign-blob --yes --bundle release/SHA256SUMS.txt.sigstore.json release/SHA256SUMS.txt
      - name: Attest the complete RC checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-rc-release-assets
          path: release
          if-no-files-found: error

  rc-release:
    name: Publish verified RC prerelease
    if: needs.metadata.outputs.stable != 'true'
    needs: [metadata, release-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-rc-release-assets
          path: release
      - id: draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Home Tunnel ${{ needs.metadata.outputs.rc-version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Android 8.0+ `arm64-v8a` is introduced as Experimental software.
            Sideload `HomeTunnel-Android-${{ needs.metadata.outputs.base-version }}-arm64-v8a.apk`
            only after verifying `SHA256SUMS.txt`, the persistent signing
            certificate fingerprint, and the attached Sigstore evidence. The
            AAB is a non-installable audit/upload artifact and is not declared
            Play-ready. Android foreground-service notification and OEM battery
            restrictions can affect background tunnel reliability. This first
            Android client advertises HTTP support only and never starts assigned
            TCP/UDP records.

            Android 8.0+ `arm64-v8a` 首版为 Experimental。普通用户应核验
            SHA-256、长期签名证书指纹与 Sigstore 证据后侧载 APK；AAB 不能
            直接安装，也不代表已满足 Google Play 发布要求。前台服务通知、
            省电策略与 OEM 后台限制可能影响隧道常驻可靠性。

            Back up SQLite and upgrade the control center, FRPS, and managed
            clients together. Raw TCP/UDP bypass Caddy and the Traffic Gateway,
            so gateway authentication, allowlists, limits, metering, and quotas
            do not apply. The matching Stable tag must promote the exact
            `${{ needs.metadata.outputs.rc-version }}` commit and asset set.

            Windows x64 EXE is Experimental and uses an ephemeral self-signed
            certificate. Windows can show an unknown-publisher or SmartScreen
            warning. Verify SHA256SUMS.txt and the attached Sigstore evidence.
          fail_on_unmatched_files: true
          files: release/*
      - name: Publish prerelease without moving latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false
      - name: Remove unpublished draft after failure
        if: ${{ failure() && steps.draft.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release delete "$TAG" --yes || true

  stable-release:
    name: Verify RC and promote exact artifacts to Stable
    if: needs.metadata.outputs.stable == 'true'
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the published RC assets without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ needs.metadata.outputs.rc-tag }}
          RC_VERSION: ${{ needs.metadata.outputs.rc-version }}
          BASE_VERSION: ${{ needs.metadata.outputs.base-version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir release
          gh release download "$RC_TAG" --dir release
          (
            cd release
            shasum -a 256 -c SHA256SUMS.txt
            expected_assets=$(mktemp)
            actual_assets=$(mktemp)
            trap 'rm -f "$expected_assets" "$actual_assets"' EXIT
            {
              sed -E 's/^[0-9a-f]{64} [ *]//' SHA256SUMS.txt
              printf '%s\n' SHA256SUMS.txt SHA256SUMS.txt.sigstore.json
            } | sort > "$expected_assets"
            find . -maxdepth 1 -type f -printf '%f\n' | sort > "$actual_assets"
            diff -u "$expected_assets" "$actual_assets" || {
              echo 'RC Release contains an asset outside the signed aggregate manifest.' >&2
              exit 1
            }
          )
          cosign verify-blob --bundle release/SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com release/SHA256SUMS.txt
          cosign verify-blob --bundle release/image-digests.json.sigstore.json \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com release/image-digests.json
          cosign verify-blob --bundle release/windows-agent-provenance.json.sigstore.json \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com release/windows-agent-provenance.json
          test "$(jq -r .version release/image-digests.json)" = "$RC_VERSION"
          test "$(jq -r .revision release/image-digests.json)" = "$GITHUB_SHA"
          test "$(jq -S -c . release/frps-dependency.json)" = \
            "$(jq -S -c .dependencies.frps release/image-digests.json)"
          test "$(jq -r .status release/release-smoke.json)" = passed
          for platform in linux macos; do
            for arch in amd64 arm64; do
              prefix="release/home-tunnel-$platform-$RC_VERSION-$arch"
              test -s "$prefix.tar.gz" && test -s "$prefix.sha256" && test -s "$prefix.tar.gz.spdx.json"
              test -s "$prefix.tar.gz.sigstore.json" && test -s "$prefix.sha256.sigstore.json"
              test -s "$prefix.tar.gz.spdx.json.sigstore.json"
              for subject in "$prefix.tar.gz" "$prefix.sha256" "$prefix.tar.gz.spdx.json"; do
                cosign verify-blob --bundle "$subject.sigstore.json" \
                  --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com "$subject"
              done
            done
          done
          windows_exe="release/HomeTunnel-Setup-$BASE_VERSION-x64.exe"
          test -s "$windows_exe" && test -s "$windows_exe.sha256" && test -s "$windows_exe.spdx.json"
          test -s "$windows_exe.sigstore.json" && test -s "$windows_exe.sha256.sigstore.json"
          test -s "$windows_exe.spdx.json.sigstore.json"
          (cd release && sha256sum -c "HomeTunnel-Setup-$BASE_VERSION-x64.exe.sha256")
          for subject in "$windows_exe" "$windows_exe.sha256" "$windows_exe.spdx.json"; do
            cosign verify-blob --bundle "$subject.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$subject"
          done
          windows_sha=$(sha256sum "$windows_exe" | awk '{print $1}')
          for support in HomeTunnel-Internal-Code-Signing.cer latest.json README-EXE.txt SIGNATURE.txt windows-agent-provenance.json; do
            test -s "release/$support"
          done
          jq -e --arg version "$BASE_VERSION" '
            .agent_version == $version and .frp_version == "0.70.1" and
            .authenticode == "ephemeral self-signed; Windows may show unknown publisher"' \
            release/windows-agent-provenance.json >/dev/null
          jq -e --arg version "$BASE_VERSION" --arg sha "$windows_sha" '
            .version == $version and .sha256 == $sha and
            .release_channel == "experimental" and
            .signature_trust == "untrusted-self-signed"' release/latest.json >/dev/null
          jq -e --arg version "$BASE_VERSION" --arg sha "$windows_sha" '
            .status == "passed" and .version == $version and .installer_sha256 == $sha and
            .install == "passed" and .uninstalled == true' release/windows-exe-smoke.json >/dev/null
          android_apk="release/HomeTunnel-Android-$BASE_VERSION-arm64-v8a.apk"
          android_aab="release/HomeTunnel-Android-$BASE_VERSION.aab"
          for subject in "$android_apk" "$android_aab"; do
            test -s "$subject" && test -s "$subject.sha256" && test -s "$subject.spdx.json"
            test -s "$subject.sigstore.json" && test -s "$subject.sha256.sigstore.json"
            test -s "$subject.spdx.json.sigstore.json"
            (cd release && sha256sum -c "$(basename "$subject").sha256")
            for signed_subject in "$subject" "$subject.sha256" "$subject.spdx.json"; do
              cosign verify-blob --bundle "$signed_subject.sigstore.json" \
                --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$signed_subject"
            done
          done
          test -s release/android-release-evidence.json
          test -s release/android-release-evidence.json.sigstore.json
          cosign verify-blob --bundle release/android-release-evidence.json.sigstore.json \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com release/android-release-evidence.json

          expected_android_code=$(sed -n 's/^HOME_TUNNEL_VERSION_CODE=//p' android-client/gradle.properties)
          expected_android_cert=$(tr -d '[:space:]:' < android-client/release-signing-cert.sha256 | tr 'A-F' 'a-f')
          [[ "$expected_android_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_android_cert" =~ ^[0-9a-f]{64}$ ]]
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          apkanalyzer=$(command -v apkanalyzer || find "$sdk_root/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort -V | tail -n 1)
          test -x "$apksigner" && test -x "$apkanalyzer"
          android_apk_signature=$($apksigner verify --verbose --print-certs "$android_apk")
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$android_apk_signature"
          android_apk_cert=$(sed -nE \
            -e 's/^Signer #1 certificate SHA-256 digest: //p' \
            -e 's/^V[0-9.]+ Signer: certificate SHA-256 digest: //p' \
            <<< "$android_apk_signature" | tr 'A-F' 'a-f' | sort -u | tr -d '[:space:]:' )
          [[ "$android_apk_cert" =~ ^[0-9a-f]{64}$ ]]
          test "$android_apk_cert" = "$expected_android_cert"
          test "$($apkanalyzer manifest application-id "$android_apk")" = io.github.zhanry.hometunnel
          test "$($apkanalyzer manifest version-name "$android_apk")" = "$BASE_VERSION"
          test "$($apkanalyzer manifest version-code "$android_apk")" = "$expected_android_code"
          test "$($apkanalyzer manifest min-sdk "$android_apk")" -eq 26
          test "$($apkanalyzer manifest target-sdk "$android_apk")" -ge 35
          test "$(unzip -Z1 "$android_apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)" = arm64-v8a
          unzip -Z1 "$android_apk" | grep -Fxq lib/arm64-v8a/libhometunnel_agent.so
          promoted_apk_agent_sha=$(unzip -p "$android_apk" lib/arm64-v8a/libhometunnel_agent.so | sha256sum | awk '{print $1}')

          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$bundletool"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$bundletool" | sha256sum -c -
          java -jar "$bundletool" validate --bundle="$android_aab"
          android_aab_signature=$(jarsigner -verify -verbose -certs "$android_aab" 2>&1)
          grep -Fq 'jar verified.' <<< "$android_aab_signature"
          android_aab_cert=$(keytool -printcert -jarfile "$android_aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          test "$android_aab_cert" = "$expected_android_cert"
          test "$(java -jar "$bundletool" dump manifest --bundle="$android_aab" --xpath=/manifest/@package)" = io.github.zhanry.hometunnel
          test "$(java -jar "$bundletool" dump manifest --bundle="$android_aab" --xpath=/manifest/@android:versionName)" = "$BASE_VERSION"
          test "$(java -jar "$bundletool" dump manifest --bundle="$android_aab" --xpath=/manifest/@android:versionCode)" = "$expected_android_code"
          test "$(unzip -Z1 "$android_aab" | sed -n 's#^base/lib/\([^/]*\)/.*#\1#p' | sort -u)" = arm64-v8a
          unzip -Z1 "$android_aab" | grep -Fxq base/lib/arm64-v8a/libhometunnel_agent.so
          promoted_aab_agent_sha=$(unzip -p "$android_aab" base/lib/arm64-v8a/libhometunnel_agent.so | sha256sum | awk '{print $1}')
          test "$promoted_apk_agent_sha" = "$promoted_aab_agent_sha"
          android_apk_sha=$(sha256sum "$android_apk" | awk '{print $1}')
          android_aab_sha=$(sha256sum "$android_aab" | awk '{print $1}')
          jq -e --arg version "$BASE_VERSION" --argjson version_code "$expected_android_code" \
            --arg apk_sha "$android_apk_sha" --arg aab_sha "$android_aab_sha" \
            --arg agent_sha "$promoted_apk_agent_sha" \
            --arg cert "$expected_android_cert" --arg revision "$GITHUB_SHA" '
            .status == "passed" and .release_channel == "experimental" and
            .platform == "android" and .application_id == "io.github.zhanry.hometunnel" and
            .version_name == $version and .version_code == $version_code and .min_sdk == 26 and
            .target_sdk >= 35 and .abis == ["arm64-v8a"] and
            .apk_sha256 == $apk_sha and .aab_sha256 == $aab_sha and
            .agent_sha256 == $agent_sha and
            .signing_certificate_sha256 == $cert and .repository_revision == $revision and
            (.validations | index("embedded_agent_hash")) and
            .physical_arm64_install == "not_run_in_github_actions"' \
            release/android-release-evidence.json >/dev/null
          for evidence in e2e-smoke.json backup.json restore.json release-smoke.json windows-exe-smoke.json android-release-evidence.json; do
            test -s "release/$evidence"
          done
          jq -e '.status == "passed" and (.tests | index("authenticated_api")) and
            (.tests | index("http_local")) and (.tests | index("https_local")) and
            (.tests | index("websocket")) and (.tests | index("policy_revocation"))' \
            release/e2e-smoke.json >/dev/null
          jq -e '.status == "healthy"' release/backup.json >/dev/null
          jq -e '.status == "healthy"' release/restore.json >/dev/null
      - name: Verify registry digests and save recoverable latest pointers
        shell: bash
        env:
          RC_TAG: ${{ needs.metadata.outputs.rc-tag }}
          RC_VERSION: ${{ needs.metadata.outputs.rc-version }}
        run: |
          set -euo pipefail
          frps_image=$(jq -r '.dependencies.frps.image' release/image-digests.json)
          frps_image_tag=$(jq -r '.dependencies.frps.image_tag' release/image-digests.json)
          frps_digest=$(jq -r '.dependencies.frps.digest' release/image-digests.json)
          published_frps=$(docker buildx imagetools inspect "$frps_image:$frps_image_tag" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$published_frps" = "$frps_digest"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/frps-image\\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$frps_image@$frps_digest"
          images=(
            ghcr.io/zhanry/home-tunnel-control-center
            ghcr.io/zhanry/home-tunnel-traffic-gateway
          )
          names=(control-center traffic-gateway)
          : > previous-latest-digests.txt
          for index in "${!images[@]}"; do
            image=${images[$index]}
            expected=$(jq -r --arg name "${names[$index]}" '.images[$name].digest' release/image-digests.json)
            rc_digest=$(docker buildx imagetools inspect "$image:$RC_VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            test "$rc_digest" = "$expected" || {
              echo "$image RC digest differs from the signed manifest" >&2
              exit 1
            }
            cosign verify \
              --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release-images\\.yml@refs/tags/$RC_TAG$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image@$expected"
            old_digest=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
            [[ "$old_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Stable promotion requires an existing recoverable latest digest for $image" >&2
              exit 1
            }
            printf '%s\n' "$old_digest" >> previous-latest-digests.txt
          done
      - id: draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Home Tunnel ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
          body: |
            Android 8.0+ `arm64-v8a` is introduced as Experimental software.
            Sideload `HomeTunnel-Android-${{ needs.metadata.outputs.base-version }}-arm64-v8a.apk`
            only after verifying `SHA256SUMS.txt`, the persistent signing
            certificate fingerprint, and the attached Sigstore evidence. The
            AAB is a non-installable audit/upload artifact and is not declared
            Play-ready. Android foreground-service notification and OEM battery
            restrictions can affect background tunnel reliability. This first
            Android client advertises HTTP support only and never starts assigned
            TCP/UDP records.

            Android 8.0+ `arm64-v8a` 首版为 Experimental。普通用户应核验
            SHA-256、长期签名证书指纹与 Sigstore 证据后侧载 APK；AAB 不能
            直接安装，也不代表已满足 Google Play 发布要求。前台服务通知、
            省电策略与 OEM 后台限制可能影响隧道常驻可靠性。

            Back up SQLite and upgrade the control center, FRPS, and managed
            clients together. Raw TCP/UDP bypass Caddy and the Traffic Gateway,
            so gateway authentication, allowlists, limits, metering, and quotas
            do not apply. This Stable release promotes the exact
            `${{ needs.metadata.outputs.rc-version }}` commit and asset set
            without rebuilding or re-signing Android packages.

            Windows x64 EXE is Experimental and uses an ephemeral self-signed
            certificate. Windows can show an unknown-publisher or SmartScreen
            warning. Verify SHA256SUMS.txt and the attached Sigstore evidence.
          fail_on_unmatched_files: true
          files: release/*
      - id: promote
        name: Promote signed RC digests to Stable and latest
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          images=(
            ghcr.io/zhanry/home-tunnel-control-center
            ghcr.io/zhanry/home-tunnel-traffic-gateway
          )
          names=(control-center traffic-gateway)
          mapfile -t old_digests < previous-latest-digests.txt
          promoted=0
          rollback() {
            status=$?
            if [ "$status" -ne 0 ]; then
              for ((index=0; index<promoted; index+=1)); do
                docker buildx imagetools create --tag "${images[$index]}:latest" "${images[$index]}@${old_digests[$index]}" || true
              done
            fi
            exit "$status"
          }
          trap rollback EXIT
          for index in "${!images[@]}"; do
            digest=$(jq -r --arg name "${names[$index]}" '.images[$name].digest' release/image-digests.json)
            docker buildx imagetools create \
              --tag "${images[$index]}:$VERSION" \
              --tag "${images[$index]}:latest" \
              "${images[$index]}@$digest"
            promoted=$((promoted + 1))
          done
          trap - EXIT
      - name: Publish the staged Stable Release
        id: publish-stable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --prerelease=false --latest
      - name: Restore latest pointers after any later Stable failure
        if: ${{ failure() && steps.promote.outcome == 'success' && steps.publish-stable.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          images=(
            ghcr.io/zhanry/home-tunnel-control-center
            ghcr.io/zhanry/home-tunnel-traffic-gateway
          )
          mapfile -t old_digests < previous-latest-digests.txt
          for index in "${!images[@]}"; do
            docker buildx imagetools create --tag "${images[$index]}:latest" "${images[$index]}@${old_digests[$index]}" || true
          done
      - name: Remove unpublished draft after failure
        if: ${{ failure() && steps.draft.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release delete "$TAG" --yes || true
  release-gate:
    name: Release Gate
    needs: [metadata, images, agent-evidence, android-package, client-packages, rc-assets, release-smoke, rc-release, stable-release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one complete release path
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          STABLE: ${{ needs.metadata.outputs.stable }}
          IMAGES_RESULT: ${{ needs.images.result }}
          AGENT_EVIDENCE_RESULT: ${{ needs.agent-evidence.result }}
          ANDROID_PACKAGE_RESULT: ${{ needs.android-package.result }}
          PACKAGES_RESULT: ${{ needs.client-packages.result }}
          ASSETS_RESULT: ${{ needs.rc-assets.result }}
          SMOKE_RESULT: ${{ needs.release-smoke.result }}
          RC_RELEASE_RESULT: ${{ needs.rc-release.result }}
          STABLE_RELEASE_RESULT: ${{ needs.stable-release.result }}
        run: |
          set -euo pipefail
          test "$METADATA_RESULT" = success
          if [ "$STABLE" = true ]; then
            test "$IMAGES_RESULT" = skipped
