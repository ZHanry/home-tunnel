name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: TypeScript services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [control-center, traffic-gateway]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:coverage
      - if: matrix.service == 'control-center'
        run: pnpm run test:coverage:realtime
      - if: matrix.service == 'control-center'
        run: pnpm run test:public
      - if: matrix.service == 'control-center'
        run: pnpm run test:integration

  windows-client:
    name: Windows client
    runs-on: windows-latest
    env:
      HOME_TUNNEL_SKIP_AGENT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Restore .NET dependencies
        run: dotnet restore .\windows-client-tests\HomeTunnel.Client.Tests.csproj --locked-mode
      - name: Audit .NET dependencies
        run: dotnet list .\windows-client-tests\HomeTunnel.Client.Tests.csproj package --vulnerable --include-transitive --no-restore
      - name: Verify C# formatting and analyzers
        run: dotnet format .\windows-client-tests\HomeTunnel.Client.Tests.csproj --verify-no-changes --no-restore --severity warn
      - name: Build Windows client with analyzers
        run: dotnet build .\windows-client-tests\HomeTunnel.Client.Tests.csproj -c Release --no-restore -warnaserror
      - name: Run xUnit tests
        run: dotnet test .\windows-client-tests\HomeTunnel.Client.Tests.csproj -c Release --no-build

  windows-agent:
    name: Windows agent official baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # windows runner 镜像不保证自带 mingw/windres，统一通过 choco 安装
      # （mingw 包含 binutils 的 windres）。机器 PATH 的变更对本步骤进程
      # 不可见，所以在同一步骤内定位 windres.exe 并显式传给构建脚本。
      - name: Install windres (mingw binutils)
        shell: pwsh
        run: |
          choco install mingw --version=16.1.0 -y --no-progress
          $windres = (Get-Command windres -ErrorAction SilentlyContinue).Source
          if (-not $windres) {
            $windres = Get-ChildItem C:\ProgramData\chocolatey, C:\ProgramData\mingw64 -Recurse `
              -Filter windres.exe -File -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $windres) { throw 'windres.exe not found after mingw install' }
          "HOME_TUNNEL_WINDRES=$windres" >> $env:GITHUB_ENV
      # build-agent.ps1 自行下载 pinned Go 工具链与 FRP 源码、校验哈希、
      # 构建并自检版本；stdout 的 AGENT_SHA256= 行即发布基线哈希。
      - name: Build official agent baseline
        shell: pwsh
        run: |
          $lines = & .\windows-client\build-agent.ps1 -WindRes $env:HOME_TUNNEL_WINDRES
          $lines | Write-Output
          $sha = ($lines | Where-Object { $_ -like 'AGENT_SHA256=*' } | Select-Object -First 1) -replace '^AGENT_SHA256=', ''
          if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'AGENT_SHA256 line missing from build-agent.ps1 output' }
          [xml]$project = Get-Content -LiteralPath .\windows-client\HomeTunnel.Client.csproj
          $expectedSha = ($project.Project.PropertyGroup.AgentExpectedSha256 | Where-Object { $_ } | Select-Object -First 1).InnerText
          if ($sha -ne $expectedSha) { throw "Agent baseline hash mismatch: built=$sha expected=$expectedSha" }
          $lines | Where-Object { $_ -match '^(AGENT_VERSION|FRP_VERSION|FRP_COMMIT|AGENT_SHA256)=' } |
            Set-Content -LiteralPath agent-baseline.txt
          '## Home Tunnel Agent official baseline' >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          "``AGENT_SHA256=$sha``" >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          '该哈希已与 windows-client/HomeTunnel.Client.csproj 的 AgentExpectedSha256 核验一致。' >> $env:GITHUB_STEP_SUMMARY
      # 复用脚本刚下载的同一工具链与 FRP 树，按受管布局跑 Agent 校验逻辑
      # 的 gofmt/vet/test，保证 CI 每次验证白名单校验逻辑本身。
      - name: Run agent Go checks inside the pinned FRP tree
        shell: pwsh
        run: |
          $env:GOFLAGS = '-buildvcs=false'
          $goBin = Join-Path (Get-Location) '.downloads\go-toolchain\go\bin'
          $frpRoot = Get-ChildItem (Join-Path '.downloads' 'frp-api-*') -Directory |
            ForEach-Object { Get-ChildItem $_.FullName -Directory } |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'go.mod') } |
            Select-Object -First 1
          if (-not $frpRoot) { throw 'pinned FRP source tree not found under .downloads' }
          $agentCmd = Join-Path $frpRoot.FullName 'cmd\home-tunnel-agent'
          New-Item -ItemType Directory -Force $agentCmd | Out-Null
          Copy-Item windows-agent\main.go, windows-agent\main_test.go $agentCmd
          try {
            $unformatted = & (Join-Path $goBin 'gofmt.exe') -l (Join-Path $agentCmd 'main.go') (Join-Path $agentCmd 'main_test.go')
            if ($unformatted) { throw "gofmt found unformatted agent files: $unformatted" }
            Push-Location $frpRoot.FullName
            try {
              & (Join-Path $goBin 'go.exe') vet ./cmd/home-tunnel-agent/
              if ($LASTEXITCODE -ne 0) { throw 'agent go vet failed' }
              & (Join-Path $goBin 'go.exe') test -count=1 ./cmd/home-tunnel-agent/
              if ($LASTEXITCODE -ne 0) { throw 'agent go test failed' }
            }
            finally {
              Pop-Location
            }
          }
          finally {
            Remove-Item -LiteralPath $agentCmd -Recurse -Force
          }
      - name: Upload agent baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-tunnel-agent-baseline
          path: |
            windows-client/assets/HomeTunnel.Agent.exe
            agent-baseline.txt
          if-no-files-found: error

  repository:
    name: Repository and Compose checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: linux-client/go.mod
      - name: Install pinned Go analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Check Go formatting
        run: |
          mapfile -d '' go_files < <(find linux-client -type f -name '*.go' -print0)
          test -z "$(gofmt -l windows-agent/main.go windows-agent/main_test.go "${go_files[@]}")"
      - name: Test Linux client
        working-directory: linux-client
        run: go test -race ./...
      - name: Vet Linux client
        working-directory: linux-client
        run: go vet ./...
      - name: Staticcheck Linux client
        working-directory: linux-client
        run: staticcheck ./...
      - name: Audit Linux client vulnerabilities
        working-directory: linux-client
        run: govulncheck ./...
      - name: Build Linux client controller
        working-directory: linux-client
        run: CGO_ENABLED=0 go build ./cmd/home-tunnel-client
      - name: Check Linux packaging scripts
        run: bash -n linux-client/packaging/build-release.sh linux-client/packaging/install.sh linux-client/packaging/home-tunnel-enroll
      - name: Shellcheck shell scripts
        run: |
          shellcheck --severity=warning \
            linux-client/packaging/*.sh \
            linux-client/packaging/home-tunnel-enroll \
            deploy/scripts/*.sh \
            deploy/frps/entrypoint.sh
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #**/node_modules
            #docs/archive/**
      - name: Check version consistency
        run: |
          set -euo pipefail
          # The single-quoted expressions below intentionally match literal source syntax.
          model_version=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' linux-client/internal/model/model.go)
          env_version=$(sed -n 's/^HOME_TUNNEL_VERSION=//p' .env.example)
          deployment_base_version=${env_version%%-rc.*}
          release_version=$(sed -n 's/^version=\${VERSION:-\([^}]*\)}$/\1/p' linux-client/packaging/build-release.sh)
          control_center_version=$(node -p "require('./control-center/package.json').version")
          gateway_version=$(node -p "require('./traffic-gateway/package.json').version")
          app_version=$(sed -n 's/^export const APP_VERSION = "\([^"]*\)";$/\1/p' control-center/src/version.ts)
          windows_project_version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' windows-client/HomeTunnel.Client.csproj)
          windows_manifest_version=$(sed -n 's/.*assemblyIdentity version="\([0-9.]*\)".*/\1/p' windows-client/app.manifest | sed 's/\.0$//')
          windows_appx_version=$(sed -n 's/.*Identity .* Version="\([0-9.]*\)".*/\1/p' windows-client/packaging/AppxManifest.xml | sed 's/\.0$//')
          windows_inno_version=$(sed -n 's/.*MyAppVersion "\([^"]*\)".*/\1/p' windows-client/packaging/HomeTunnel.iss | head -n 1)
          windows_agent_version=$(tr -d '\r' < windows-client/build-agent.ps1 | sed -n 's/^\$agentVersion = "\([^"]*\)"$/\1/p')
          windows_agent_resource_version=$(sed -n 's/.*VALUE "ProductVersion", "\([^"]*\)\\0".*/\1/p' windows-agent/HomeTunnel.Agent.rc)
          windows_agent_reported_version=$(tr -d '\r' < windows-client/Services/FrpcSupervisor.cs | sed -n 's/^[[:space:]]*public const string Version = "\([^"]*\)";$/\1/p')
          root_compose_versions=$(sed -n 's/.*{HOME_TUNNEL_VERSION:-\([^}]*\)}.*/\1/p' compose.yaml | sort -u)
          deploy_compose_versions=$(grep -oE 'home-tunnel/(control-center|traffic-gateway):[0-9][0-9A-Za-z.-]*' deploy/compose.yaml | sed 's/.*://; s/-arm64$//' | sort -u)
          test "$(grep -Ec 'home-tunnel/(control-center|traffic-gateway):[0-9][0-9A-Za-z.-]*-arm64$' deploy/compose.yaml)" = 2
          generated_config_versions=$(grep -h '^HOME_TUNNEL_VERSION=' deploy/scripts/new-selfhost-config.sh deploy/scripts/new-selfhost-config.ps1 | tr -d '\r' | sed 's/.*=//' | sort -u)
          public_versions=$(grep -hoE 'v=?[0-9]+\.[0-9]+\.[0-9]+' control-center/public/index.html control-center/public/modules/*.js | sed -E 's/^v=?//' | sort -u)
          echo "model=$model_version env=$env_version release=$release_version control_center=$control_center_version gateway=$gateway_version app=$app_version windows_project=$windows_project_version windows_manifest=$windows_manifest_version windows_appx=$windows_appx_version windows_inno=$windows_inno_version windows_agent=$windows_agent_version windows_agent_resource=$windows_agent_resource_version windows_agent_reported=$windows_agent_reported_version root_compose=$root_compose_versions deploy_compose=$deploy_compose_versions generated_config=$generated_config_versions public=$public_versions"
          test -n "$model_version" && test -n "$env_version" && test -n "$release_version" && test -n "$control_center_version" && test -n "$gateway_version" && test -n "$app_version" && test -n "$windows_project_version" && test -n "$windows_manifest_version" && test -n "$windows_appx_version" && test -n "$windows_inno_version" && test -n "$windows_agent_version" && test -n "$windows_agent_resource_version" && test -n "$windows_agent_reported_version"
          test -n "$root_compose_versions" && test -n "$deploy_compose_versions"
          test -n "$generated_config_versions" && test -n "$public_versions"
          for candidate in "$release_version" "$control_center_version" "$gateway_version" "$app_version" "$windows_project_version" "$windows_manifest_version" "$windows_appx_version" "$windows_inno_version" $public_versions; do
            if [ "$candidate" != "$model_version" ]; then
              echo "version mismatch: expected $model_version, found $candidate" >&2
              exit 1
            fi
          done
          test "$deployment_base_version" = "$model_version"
          for candidate in $root_compose_versions $deploy_compose_versions $generated_config_versions; do
            test "$candidate" = "$env_version" || { echo "deployment version mismatch: expected $env_version, found $candidate" >&2; exit 1; }
          done
          test "$windows_agent_resource_version" = "$windows_agent_version"
          test "$windows_agent_reported_version" = "$windows_agent_version"
          grep -q -- '-X main.agentVersion=$agent_version' linux-client/packaging/build-release.sh
          grep -q -- '-X main.agentVersion=$agent_version' linux-client/packaging/macos/build-release.sh
      - name: Prepare non-production Compose inputs
        run: |
          cp .env.example .env
          mkdir -p deploy/secrets
          for name in internal_service_key frps_plugin_key lease_signing_key bootstrap_admin_password; do
            printf '%064d\n' 0 > "deploy/secrets/$name"
          done
          # compose config only checks that secret files exist; stub PEM content is enough.
          printf -- '-----BEGIN CERTIFICATE-----\nstub\n-----END CERTIFICATE-----\n' > deploy/secrets/frps_tls_cert.pem
          printf -- '-----BEGIN PRIVATE KEY-----\nstub\n-----END PRIVATE KEY-----\n' > deploy/secrets/frps_tls_key.pem
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Validate deploy Compose file
        run: |
          docker network inspect home-tunnel-edge >/dev/null 2>&1 || docker network create home-tunnel-edge
          docker compose -f deploy/compose.yaml --env-file .env config --quiet
      - name: Validate RC-aware offline deployment scripts
        shell: pwsh
        run: |
          $paths = @(
            'deploy/build-ui-release.ps1',
            'deploy/build-release.ps1',
            'deploy/deploy-ui.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax check failed for ${path}: $($errors.Message -join '; ')"
            }
          }
          $buildUi = Get-Content -Raw -LiteralPath deploy/build-ui-release.ps1
          $buildServer = Get-Content -Raw -LiteralPath deploy/build-release.ps1
          $deployUi = Get-Content -Raw -LiteralPath deploy/deploy-ui.ps1
          foreach ($source in @($buildUi, $buildServer, $deployUi)) {
            if ($source -notmatch '\(\?:-rc\\\.\\d\+\)\?') {
              throw 'An offline PowerShell release path does not accept RC versions'
            }
          }
          if ($buildUi -notmatch '\$sourceVersion\s*=.*-replace' -or
              $buildServer -notmatch '\$sourceVersion\s*=.*-replace') {
            throw 'Offline builders must compare RC tags to the source base version'
          }
      - name: Validate RC-aware remote update script
        run: |
          set -euo pipefail
          # The grep expressions below intentionally match literal shell/JavaScript source.
          bash -n deploy/scripts/update-ui.sh
          grep -Fq '(-rc\.[0-9]+)?$' deploy/scripts/update-ui.sh
          grep -Fq 'source_version="${version%%-rc.*}"' deploy/scripts/update-ui.sh
          grep -Fq "b.version!=='\$source_version'" deploy/scripts/update-ui.sh

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir .
            --no-progress
            './*.md'
            './.github/*.md'
            './deploy/**/*.md'
            './docs/**/*.md'
            './linux-client/**/*.md'
            './docs/site/**/*.html'
          fail: true

  quality-gate:
    name: Quality Gate
    needs: [services, windows-client, windows-agent, repository, links, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          SERVICES_RESULT: ${{ needs.services.result }}
          WINDOWS_CLIENT_RESULT: ${{ needs.windows-client.result }}
          WINDOWS_AGENT_RESULT: ${{ needs.windows-agent.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          LINKS_RESULT: ${{ needs.links.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$SERVICES_RESULT" = success
          test "$WINDOWS_CLIENT_RESULT" = success
          test "$WINDOWS_AGENT_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$LINKS_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
