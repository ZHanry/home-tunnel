name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: TypeScript services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [control-center, traffic-gateway]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:coverage
      - if: matrix.service == 'control-center'
        run: pnpm run test:coverage:realtime
      - if: matrix.service == 'control-center'
        run: pnpm run test:public
      - if: matrix.service == 'control-center'
        run: pnpm run test:integration

  android-client:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the pinned Gradle wrapper
        run: |
          set -euo pipefail
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  android-client/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          grep -Fxq 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' android-client/gradle/wrapper/gradle-wrapper.properties
          grep -Fxq 'distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' android-client/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android-client/**/*.gradle*
            android-client/gradle.properties
            android-client/gradle/wrapper/gradle-wrapper.properties
      - name: Test, lint, and assemble the unsigned debug client
        working-directory: android-client
        run: ./gradlew --no-daemon test lint assembleDebug
      - name: Require generated Android binaries to remain untracked
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- '*.apk' '*.aab' '*.aar' '*.jks' '*.keystore' '*.so')
          if [ -n "$tracked" ]; then
            echo 'Generated Android binaries or signing stores must not be committed:' >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi
          git diff --exit-code

  windows-client:
    name: Desktop GUI client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: linux-client/go.mod
      - name: Test shared Go client
        working-directory: linux-client
        run: go test ./...
      - name: Build unified desktop GUI
        working-directory: linux-client
        run: |
          go build ./cmd/home-tunnel-client
          go build -ldflags "-H windowsgui" ./cmd/home-tunnel-gui

  macos-gui:
    name: macOS graphical client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: linux-client/go.mod
      - name: Test shared Go client
        working-directory: linux-client
        run: go test ./...
      - name: Build native macOS GUI
        working-directory: linux-client
        run: CGO_ENABLED=1 go build ./cmd/home-tunnel-gui ./cmd/home-tunnel-client
      - name: Build macOS release archives
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' linux-client/internal/model/model.go)
          for architecture in amd64 arm64; do
            VERSION="$version" ARCH="$architecture" ./linux-client/packaging/macos/build-release.sh
          done
      - name: Upload macOS release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-tunnel-macos-release
          path: outputs/macos/*
          if-no-files-found: error

  windows-agent:
    name: Windows agent official baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 直接下载并校验固定的 MinGW 资产，避免 Chocolatey feed 成为发布单点。
      - name: Install pinned windres (mingw binutils)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mingw-16.1.0.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'mingw-16.1.0'
          Invoke-WebRequest -Headers @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          } -Uri 'https://api.github.com/repos/niXman/mingw-builds-binaries/releases/assets/412720050' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'ecaceb42639d21c695f875800a29b2dea76bbb05eb2a1cca3049b65499b8d867'
          if ($actual -ne $expected) { throw "MinGW archive checksum mismatch: $actual" }
          & 7z x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'MinGW extraction failed' }
          $windres = Get-ChildItem -LiteralPath $extract -Recurse -Filter windres.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $windres) { throw 'windres.exe not found in the pinned MinGW archive' }
          "HOME_TUNNEL_WINDRES=$windres" >> $env:GITHUB_ENV
      # build-agent.ps1 自行下载 pinned Go 工具链与 FRP 源码、校验哈希、
      # 构建并自检版本；stdout 的 AGENT_SHA256= 行即发布基线哈希。
      - name: Build official agent baseline
        shell: pwsh
        run: |
          $lines = & .\windows-agent\build-agent.ps1 -WindRes $env:HOME_TUNNEL_WINDRES
          $lines | Write-Output
          $sha = ($lines | Where-Object { $_ -like 'AGENT_SHA256=*' } | Select-Object -First 1) -replace '^AGENT_SHA256=', ''
          if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'AGENT_SHA256 line missing from build-agent.ps1 output' }
          $expectedSha = (Get-Content -Raw -LiteralPath .\windows-agent\expected-sha256.txt).Trim()
          if ($sha -ne $expectedSha) { throw "Agent baseline hash mismatch: built=$sha expected=$expectedSha" }
          $lines | Where-Object { $_ -match '^(AGENT_VERSION|FRP_VERSION|FRP_COMMIT|AGENT_SHA256)=' } |
            Set-Content -LiteralPath agent-baseline.txt
          '## Home Tunnel Agent official baseline' >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          "``AGENT_SHA256=$sha``" >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          '该哈希已与 windows-agent/expected-sha256.txt 核验一致。' >> $env:GITHUB_STEP_SUMMARY
      # 复用脚本刚下载的同一工具链与 FRP 树，按受管布局跑 Agent 校验逻辑
      # 的 gofmt/vet/test，保证 CI 每次验证白名单校验逻辑本身。
      - name: Run Agent Go and vulnerability checks inside the pinned FRP tree
        shell: pwsh
        run: |
          $env:GOFLAGS = '-buildvcs=false'
          $goBin = Join-Path (Get-Location) '.downloads\go-toolchain\go\bin'
          $frpRoot = Get-ChildItem (Join-Path '.downloads' 'frp-api-*') -Directory |
            ForEach-Object { Get-ChildItem $_.FullName -Directory } |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'go.mod') } |
            Select-Object -First 1
          if (-not $frpRoot) { throw 'pinned FRP source tree not found under .downloads' }
          $agentCmd = Join-Path $frpRoot.FullName 'cmd\home-tunnel-agent'
          New-Item -ItemType Directory -Force $agentCmd | Out-Null
          Copy-Item windows-agent\main.go, windows-agent\main_test.go $agentCmd
          try {
            $unformatted = & (Join-Path $goBin 'gofmt.exe') -l (Join-Path $agentCmd 'main.go') (Join-Path $agentCmd 'main_test.go')
            if ($unformatted) { throw "gofmt found unformatted agent files: $unformatted" }
            Push-Location $frpRoot.FullName
            try {
              & (Join-Path $goBin 'go.exe') vet ./cmd/home-tunnel-agent/
              if ($LASTEXITCODE -ne 0) { throw 'agent go vet failed' }
              & (Join-Path $goBin 'go.exe') test -count=1 ./cmd/home-tunnel-agent/
              if ($LASTEXITCODE -ne 0) { throw 'agent go test failed' }
              & (Join-Path $goBin 'go.exe') run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/home-tunnel-agent/
              if ($LASTEXITCODE -ne 0) { throw 'agent govulncheck failed' }
            }
            finally {
              Pop-Location
            }
          }
          finally {
            Remove-Item -LiteralPath $agentCmd -Recurse -Force
          }
      - name: Upload agent baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-tunnel-agent-baseline
          path: |
            windows-agent/assets/HomeTunnel.Agent.exe
            agent-baseline.txt
          if-no-files-found: error

  repository:
    name: Repository and Compose checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: linux-client/go.mod
      - name: Install pinned Go analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Check Go formatting
        run: |
          mapfile -d '' go_files < <(find linux-client -type f -name '*.go' -print0)
          test -z "$(gofmt -l windows-agent/main.go windows-agent/main_test.go "${go_files[@]}")"
      - name: Install desktop GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config gcc
      - name: Test Linux client
        working-directory: linux-client
        run: go test -race ./...
      - name: Vet Linux client
        working-directory: linux-client
        run: go vet ./...
      - name: Staticcheck Linux client
        working-directory: linux-client
        run: staticcheck ./...
      - name: Audit Linux client vulnerabilities
        working-directory: linux-client
        run: govulncheck ./...
      - name: Build Linux client controller
        working-directory: linux-client
        run: CGO_ENABLED=0 go build ./cmd/home-tunnel-client
      - name: Build Linux graphical client
        working-directory: linux-client
        run: CGO_ENABLED=1 go build ./cmd/home-tunnel-gui
      - name: Check release packaging scripts
        run: |
          bash -n \
            linux-client/packaging/build-release.sh \
            linux-client/packaging/install.sh \
            linux-client/packaging/home-tunnel-enroll \
            linux-client/packaging/macos/build-release.sh \
            linux-client/packaging/macos/install.sh \
            linux-client/packaging/macos/home-tunnel-enroll
      - name: Check executable release entrypoints
        run: |
          test -x linux-client/packaging/build-release.sh
          test -x linux-client/packaging/macos/build-release.sh
          test -x deploy/scripts/backup.sh
          test -x deploy/scripts/verify-backup.sh
          test -x tests/test-frps-entrypoint.sh
      - name: Shellcheck shell scripts
        run: |
          shellcheck --severity=warning \
            linux-client/packaging/*.sh \
            linux-client/packaging/home-tunnel-enroll \
            linux-client/packaging/macos/*.sh \
            linux-client/packaging/macos/home-tunnel-enroll \
            deploy/scripts/*.sh \
            deploy/frps/entrypoint.sh \
            tests/test-frps-entrypoint.sh
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #**/node_modules
      - name: Check version consistency
        run: |
          set -euo pipefail
          # The single-quoted expressions below intentionally match literal source syntax.
          model_version=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' linux-client/internal/model/model.go)
          env_version=$(sed -n 's/^HOME_TUNNEL_VERSION=//p' .env.example)
          deployment_base_version=${env_version%%-rc.*}
          release_version=$(sed -n 's/^version=\${VERSION:-\([^}]*\)}$/\1/p' linux-client/packaging/build-release.sh)
          control_center_version=$(node -p "require('./control-center/package.json').version")
          gateway_version=$(node -p "require('./traffic-gateway/package.json').version")
          app_version=$(sed -n 's/^export const APP_VERSION = "\([^"]*\)";$/\1/p' control-center/src/version.ts)
          windows_agent_version=$(tr -d '\r' < windows-agent/build-agent.ps1 | sed -n 's/^\$agentVersion = "\([^"]*\)"$/\1/p')
          windows_agent_resource_version=$(sed -n 's/.*VALUE "ProductVersion", "\([^"]*\)\\0".*/\1/p' windows-agent/HomeTunnel.Agent.rc)
          android_version_name=$(sed -n 's/^HOME_TUNNEL_VERSION_NAME=//p' android-client/gradle.properties)
          android_version_code=$(sed -n 's/^HOME_TUNNEL_VERSION_CODE=//p' android-client/gradle.properties)
          root_compose_versions=$(sed -n 's/.*{HOME_TUNNEL_VERSION:-\([^}]*\)}.*/\1/p' compose.yaml | sort -u)
          deploy_compose_versions=$(grep -oE 'home-tunnel/(control-center|traffic-gateway):[0-9][0-9A-Za-z.-]*' deploy/compose.yaml | sed 's/.*://; s/-arm64$//' | sort -u)
          test "$(grep -Ec 'home-tunnel/(control-center|traffic-gateway):[0-9][0-9A-Za-z.-]*-arm64$' deploy/compose.yaml)" = 2
          generated_config_versions=$(grep -h '^HOME_TUNNEL_VERSION=' deploy/scripts/new-selfhost-config.sh deploy/scripts/new-selfhost-config.ps1 | tr -d '\r' | sed 's/.*=//' | sort -u)
          public_versions=$(grep -hoE 'v=?[0-9]+\.[0-9]+\.[0-9]+' control-center/public/index.html control-center/public/modules/*.js | sed -E 's/^v=?//' | sort -u)
          echo "model=$model_version env=$env_version release=$release_version control_center=$control_center_version gateway=$gateway_version app=$app_version windows_agent=$windows_agent_version windows_agent_resource=$windows_agent_resource_version android_name=$android_version_name android_code=$android_version_code root_compose=$root_compose_versions deploy_compose=$deploy_compose_versions generated_config=$generated_config_versions public=$public_versions"
          test -n "$model_version" && test -n "$env_version" && test -n "$release_version" && test -n "$control_center_version" && test -n "$gateway_version" && test -n "$app_version" && test -n "$windows_agent_version" && test -n "$windows_agent_resource_version"
          test -n "$android_version_name" && [[ "$android_version_code" =~ ^[1-9][0-9]*$ ]]
          test -n "$root_compose_versions" && test -n "$deploy_compose_versions"
          test -n "$generated_config_versions" && test -n "$public_versions"
          for candidate in "$release_version" "$control_center_version" "$gateway_version" "$app_version" "$windows_agent_version" "$android_version_name" $public_versions; do
            if [ "$candidate" != "$model_version" ]; then
              echo "version mismatch: expected $model_version, found $candidate" >&2
              exit 1
            fi
          done
          test "$deployment_base_version" = "$model_version"
          for candidate in $root_compose_versions $deploy_compose_versions $generated_config_versions; do
            test "$candidate" = "$env_version" || { echo "deployment version mismatch: expected $env_version, found $candidate" >&2; exit 1; }
          done
          test "$windows_agent_resource_version" = "$windows_agent_version"
          [[ "$model_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          expected_android_code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          test "$android_version_code" -eq "$expected_android_code" || {
            echo "Android versionCode mismatch: expected $expected_android_code, found $android_version_code" >&2
            exit 1
          }
          grep -q -- '-X main.agentVersion=$agent_version' linux-client/packaging/build-release.sh
          grep -q -- '-X main.agentVersion=$agent_version' linux-client/packaging/macos/build-release.sh
      - name: Build release package smoke matrix
        run: |
          set -euo pipefail
          release_version=$(sed -n 's/^HOME_TUNNEL_VERSION=//p' .env.example)
          for architecture in amd64 arm64; do
            VERSION="$release_version" ARCH="$architecture" ./linux-client/packaging/build-release.sh
            VERSION="$release_version" ARCH="$architecture" ./linux-client/packaging/macos/build-release.sh
          done
          for platform in linux macos; do
            for architecture in amd64 arm64; do
              prefix="home-tunnel-$platform-$release_version-$architecture"
              archive="outputs/$platform/$prefix.tar.gz"
              checksum="outputs/$platform/$prefix.sha256"
              (cd "outputs/$platform" && sha256sum -c "$(basename "$checksum")")
              tar -tzf "$archive" | grep -Fx "$prefix/bin/home-tunnel-client"
              tar -tzf "$archive" | grep -Fx "$prefix/bin/home-tunnel-gui"
              tar -tzf "$archive" | grep -Fx "$prefix/lib/home-tunnel-agent"
            done
          done
      - name: Check FRP dependency consistency
        run: |
          set -euo pipefail
          frp_version=$(jq -r .version deploy/frps/dependency.json)
          frp_tag=$(jq -r .upstream_tag deploy/frps/dependency.json)
          frp_commit=$(jq -r .upstream_commit deploy/frps/dependency.json)
          frp_archive_sha256=$(jq -r .upstream_archive_sha256 deploy/frps/dependency.json)
          frps_image=$(jq -r .image deploy/frps/dependency.json)
          frps_image_tag=$(jq -r .image_tag deploy/frps/dependency.json)
          frps_digest=$(jq -r .digest deploy/frps/dependency.json)
          test "$frp_tag" = "v$frp_version"
          test "$frps_image_tag" = "0.70.1-r2"
          [[ "$frp_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$frp_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$frps_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          grep -Fq "frpVersion   = \"$frp_version\"" windows-agent/main.go
          grep -Fq "\$frpVersion = \"$frp_version\"" windows-agent/build-agent.ps1
          grep -Fq "\$frpCommit = \"$frp_commit\"" windows-agent/build-agent.ps1
          grep -Fq "\$frpArchiveSha256 = \"$frp_archive_sha256\"" windows-agent/build-agent.ps1
          grep -Fq "frp_version=$frp_version" linux-client/packaging/build-release.sh
          grep -Fq "frp_version=$frp_version" linux-client/packaging/macos/build-release.sh
          grep -Fq "frp_commit=$frp_commit" linux-client/packaging/build-release.sh
          grep -Fq "frp_commit=$frp_commit" linux-client/packaging/macos/build-release.sh
          grep -Fq "frp_archive_sha256=$frp_archive_sha256" linux-client/packaging/build-release.sh
          grep -Fq "frp_archive_sha256=$frp_archive_sha256" linux-client/packaging/macos/build-release.sh
          grep -Fq "ARG FRP_VERSION=$frp_tag" deploy/frps/Dockerfile
          grep -Fq "ARG FRP_COMMIT=$frp_commit" deploy/frps/Dockerfile
          grep -Fq "FRP_VERSION: $frp_tag" compose.build.yaml
          grep -Fq "FRP_COMMIT: $frp_commit" compose.build.yaml
          grep -Fq "$frps_image:$frps_image_tag@$frps_digest" compose.yaml
          grep -Fq "home-tunnel/frps:$frp_version-arm64" deploy/compose.yaml
          grep -Fq "$frp_commit" .github/workflows/codeql.yml
          grep -Fq "$frp_archive_sha256" .github/workflows/codeql.yml
          grep -Fq "version $frp_version, commit" windows-agent/THIRD-PARTY-NOTICES.txt
          expected_agent_sha=$(tr -d '\r\n' < windows-agent/expected-sha256.txt)
          [[ "$expected_agent_sha" =~ ^[0-9a-f]{64}$ ]]
      - name: Prepare non-production Compose inputs
        run: |
          cp .env.example .env
          mkdir -p deploy/secrets
          for name in internal_service_key frps_plugin_key lease_signing_key bootstrap_admin_password; do
            printf '%064d\n' 0 > "deploy/secrets/$name"
          done
          # compose config only checks that secret files exist; stub PEM content is enough.
          printf -- '-----BEGIN CERTIFICATE-----\nstub\n-----END CERTIFICATE-----\n' > deploy/secrets/frps_tls_cert.pem
          printf -- '-----BEGIN PRIVATE KEY-----\nstub\n-----END PRIVATE KEY-----\n' > deploy/secrets/frps_tls_key.pem
      - name: Validate IPv6 self-host configuration generation
        run: |
          set -euo pipefail
          test_root=$(mktemp -d)
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir -p "$test_root/repo/deploy/scripts"
          cp deploy/scripts/new-selfhost-config.sh "$test_root/repo/deploy/scripts/"
          (
            cd "$test_root/repo"
            sh ./deploy/scripts/new-selfhost-config.sh \
              tunnel.home.test 2001:db8:1::10 console.home.test admin@home.test
          )
          grep -Fxq 'HOME_TUNNEL_FRPS_PUBLIC_HOST=2001:db8:1::10' "$test_root/repo/.env"
          openssl x509 -in "$test_root/repo/deploy/secrets/frps_tls_cert.pem" \
            -noout -checkip 2001:db8:1::10
      - name: Validate PowerShell self-host input path
        shell: pwsh
        run: |
          ./deploy/scripts/new-selfhost-config.ps1 `
            -TunnelDomain tunnel.home.test `
            -FrpsPublicHost 2001:db8:1::10 `
            -ConsoleHost console.home.test `
            -AcmeEmail admin@home.test `
            -Force `
            -WhatIf
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Overlay without an explicit port range must fail closed
        run: |
          set -euo pipefail
          if docker compose -f compose.yaml -f deploy/compose.tcp.yaml config --quiet; then
            echo "tcp overlay must require HOME_TUNNEL_TCP_PORT_START" >&2
            exit 1
          fi
      - name: Validate TCP and UDP overlays
        env:
          HOME_TUNNEL_TCP_BIND_ADDRESS: "127.0.0.1"
          HOME_TUNNEL_TCP_PORT_START: "10554"
          HOME_TUNNEL_TCP_PORT_END: "10554"
          HOME_TUNNEL_UDP_BIND_ADDRESS: "127.0.0.1"
          HOME_TUNNEL_UDP_PORT_START: "10554"
          HOME_TUNNEL_UDP_PORT_END: "10554"
          HOME_TUNNEL_L4_BIND_ADDRESS: "127.0.0.1"
          HOME_TUNNEL_L4_PORT_START: "10554"
          HOME_TUNNEL_L4_PORT_END: "10554"
        run: |
          docker compose -f compose.yaml -f deploy/compose.tcp.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.udp.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.l4.yaml config --quiet
          ./tests/test-frps-entrypoint.sh
      - name: Validate deploy Compose file
        env:
          HOME_TUNNEL_TCP_BIND_ADDRESS: "127.0.0.1"
          HOME_TUNNEL_TCP_PORT_START: "10554"
          HOME_TUNNEL_TCP_PORT_END: "10554"
          HOME_TUNNEL_UDP_BIND_ADDRESS: "127.0.0.1"
          HOME_TUNNEL_UDP_PORT_START: "10554"
          HOME_TUNNEL_UDP_PORT_END: "10554"
          HOME_TUNNEL_L4_BIND_ADDRESS: "127.0.0.1"
          HOME_TUNNEL_L4_PORT_START: "10554"
          HOME_TUNNEL_L4_PORT_END: "10554"
        run: |
          docker network inspect home-tunnel-edge >/dev/null 2>&1 || docker network create home-tunnel-edge
          docker compose -f deploy/compose.yaml --env-file .env config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.tcp.yaml --env-file .env config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.udp.yaml --env-file .env config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.l4.yaml --env-file .env config --quiet
      - name: Validate RC-aware offline deployment scripts
        shell: pwsh
        run: |
          $paths = @(
            'android-client/scripts/build-agent.ps1',
            'deploy/build-ui-release.ps1',
            'deploy/build-release.ps1',
            'deploy/deploy-ui.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax check failed for ${path}: $($errors.Message -join '; ')"
            }
          }
          $buildUi = Get-Content -Raw -LiteralPath deploy/build-ui-release.ps1
          $buildServer = Get-Content -Raw -LiteralPath deploy/build-release.ps1
          $deployUi = Get-Content -Raw -LiteralPath deploy/deploy-ui.ps1
          foreach ($source in @($buildUi, $buildServer, $deployUi)) {
            if ($source -notmatch '\(\?:-rc\\\.\\d\+\)\?') {
              throw 'An offline PowerShell release path does not accept RC versions'
            }
          }
          if ($buildUi -notmatch '\$sourceVersion\s*=.*-replace' -or
              $buildServer -notmatch '\$sourceVersion\s*=.*-replace') {
            throw 'Offline builders must compare RC tags to the source base version'
          }
      - name: Validate RC-aware remote update script
        run: |
          set -euo pipefail
          # The grep expressions below intentionally match literal shell/JavaScript source.
          bash -n deploy/scripts/update-ui.sh
          grep -Fq '(-rc\.[0-9]+)?$' deploy/scripts/update-ui.sh
          grep -Fq 'source_version="${version%%-rc.*}"' deploy/scripts/update-ui.sh
          grep -Fq "b.version!=='\$source_version'" deploy/scripts/update-ui.sh

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir .
            --no-progress
            './*.md'
            './.github/*.md'
            './android-client/**/*.md'
            './deploy/**/*.md'
            './docs/**/*.md'
            './linux-client/**/*.md'
            './docs/site/**/*.html'
          fail: true

  quality-gate:
    name: Quality Gate
    needs: [services, android-client, windows-client, windows-agent, repository, links, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          SERVICES_RESULT: ${{ needs.services.result }}
          ANDROID_CLIENT_RESULT: ${{ needs.android-client.result }}
          WINDOWS_CLIENT_RESULT: ${{ needs.windows-client.result }}
          WINDOWS_AGENT_RESULT: ${{ needs.windows-agent.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          LINKS_RESULT: ${{ needs.links.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$SERVICES_RESULT" = success
          test "$ANDROID_CLIENT_RESULT" = success
          test "$WINDOWS_CLIENT_RESULT" = success
          test "$WINDOWS_AGENT_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$LINKS_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
