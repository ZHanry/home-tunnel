name: Publish FRPS dependency image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: frps-dependency-0.70.1-r2
  cancel-in-progress: false

env:
  FRP_VERSION: 0.70.1
  FRP_TAG: v0.70.1
  FRP_COMMIT: fa3bcca2b0c4753cd4f0e2ab189dd6a5a6a15708
  FRP_ARCHIVE_SHA256: 9c6b0188a8f74e982069dc89218cc3d79bada8663cedf3b514b98847530cbf7d
  IMAGE: ghcr.io/zhanry/home-tunnel-frps
  IMAGE_TAG: 0.70.1-r2

jobs:
  publish:
    name: Build, sign, and attest FRPS 0.70.1-r2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Require protected main and verify upstream source identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

          resolved=$(gh api "/repos/fatedier/frp/commits/$FRP_TAG" --jq .sha)
          test "$resolved" = "$FRP_COMMIT"
          archive=$(mktemp)
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/fatedier/frp/zipball/$FRP_COMMIT" > "$archive"
          actual=$(sha256sum "$archive" | cut -d' ' -f1)
          test "$actual" = "$FRP_ARCHIVE_SHA256"
          source_root=$(mktemp -d)
          unzip -q "$archive" -d "$source_root"
          module_root=$(find "$source_root" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$module_root/go.mod"
          echo "FRP_SOURCE_ROOT=$module_root" >> "$GITHUB_ENV"
          grep -Fq 'go build -tags noweb' deploy/frps/Dockerfile

      - name: Vet and audit the reviewed FRPS source
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          cd "$FRP_SOURCE_ROOT"
          go vet -tags noweb ./cmd/frps
          govulncheck -tags noweb ./cmd/frps

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and push the reviewed multi-architecture candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./deploy/frps
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            FRP_VERSION=${{ env.FRP_TAG }}
            FRP_COMMIT=${{ env.FRP_COMMIT }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Home Tunnel
          cache-from: type=gha,scope=frps-0.70.1-r2
          cache-to: type=gha,mode=max,scope=frps-0.70.1-r2

      - name: Require the complete Linux architecture matrix
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$manifest"
          jq -e \
            '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "$manifest" >/dev/null

      - name: Verify the baked L4 entrypoint before immutable publication
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE@$DIGEST"
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh "$image_ref" -eu -c '
            grep -Fq "__L4_ALLOW_PORTS__" /etc/frp/frps.toml.template
            grep -Fq '\''ops = ["Login", "NewProxy", "CloseProxy", "Ping"]'\'' /etc/frp/frps.toml.template
            grep -Fq "UDP_TUNNEL_ENABLED" /usr/local/bin/home-tunnel-frps-entrypoint
          '

          test_root=$(mktemp -d)
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir "$test_root/rendered"
          chmod 0777 "$test_root/rendered"
          printf '%064d\n' 0 > "$test_root/plugin_key"
          chmod 0444 "$test_root/plugin_key"
          cat > "$test_root/frps" <<'EOF'
          #!/bin/sh
          set -eu
          test "$1" = -c
          cat "$2"
          EOF
          chmod 0555 "$test_root/frps"

          rendered=$(docker run --rm --platform linux/amd64 \
            -e PUBLIC_FRPS_PORT=17000 \
            -e L4_TUNNEL_ENABLED=true \
            -e L4_PORT_START=11000 \
            -e L4_PORT_END=11009 \
            -v "$test_root/plugin_key:/run/secrets/frps_plugin_key:ro" \
            -v "$test_root/rendered:/run/frp" \
            -v "$test_root/frps:/usr/local/bin/frps:ro" \
            "$image_ref")
          grep -Fq 'allowPorts = [{ start = 11000, end = 11009 }]' <<<"$rendered"
          grep -Fq 'ops = ["Login", "NewProxy", "CloseProxy", "Ping"]' <<<"$rendered"

      - name: Publish GitHub image attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the immutable image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/frps-image\\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >/dev/null

      - name: Write and sign the dependency manifest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$FRP_VERSION" \
            --arg upstream_tag "$FRP_TAG" \
            --arg upstream_commit "$FRP_COMMIT" \
            --arg upstream_archive_sha256 "$FRP_ARCHIVE_SHA256" \
            --arg image "$IMAGE" \
            --arg image_tag "$IMAGE_TAG" \
            --arg digest "$DIGEST" \
            --arg repository_revision "$GITHUB_SHA" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version:1,version:$version,upstream_tag:$upstream_tag,
              upstream_commit:$upstream_commit,upstream_archive_sha256:$upstream_archive_sha256,
              image:$image,image_tag:$image_tag,digest:$digest,repository_revision:$repository_revision,
              workflow_run:$workflow_run}' > frps-dependency.json
          cosign sign-blob --yes --bundle frps-dependency.json.sigstore.json frps-dependency.json

      - name: Attest the dependency manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: frps-dependency.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frps-0.70.1-r2-dependency-manifest
          path: |
            frps-dependency.json
            frps-dependency.json.sigstore.json
          if-no-files-found: error

      - name: Publish the immutable reviewed version tag
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if existing=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" \
            --format '{{json .Manifest.Digest}}' 2>/dev/null); then
            existing=${existing//\"/}
            test "$existing" = "$DIGEST" || {
              echo "$IMAGE:$IMAGE_TAG already identifies a different digest" >&2
              exit 1
            }
          else
            docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" "$IMAGE@$DIGEST"
          fi
          published=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$published" = "$DIGEST"
