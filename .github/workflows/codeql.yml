name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            name: JavaScript and TypeScript
            os: ubuntu-latest
            build-mode: none
          - language: go
            name: Go Linux client
            os: ubuntu-latest
            build-mode: manual
            target: linux-client
          - language: go
            name: Go Windows Agent
            os: windows-latest
            build-mode: manual
            target: windows-agent
          - language: csharp
            name: C# Windows client
            os: windows-latest
            build-mode: none
          - language: java-kotlin
            name: Java/Kotlin Android client
            os: ubuntu-latest
            build-mode: manual
            target: android-client
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - if: matrix.target == 'android-client'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android-client/**/*.gradle*
            android-client/gradle.properties
            android-client/gradle/wrapper/gradle-wrapper.properties
      - if: matrix.target == 'android-client'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - if: matrix.target == 'android-client'
        name: Select the pinned Android NDK for the x86_64 analysis Agent
        shell: bash
        run: |
          set -euo pipefail
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          test -d "$sdk_root"
          ndk="$sdk_root/ndk/27.2.12479018"
          if [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" ]; then
            sdkmanager_bin=$(command -v sdkmanager || find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
            test -x "$sdkmanager_bin"
            "$sdkmanager_bin" 'ndk;27.2.12479018'
          fi
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK_VERSION=27.2.12479018"
          } >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.target == 'linux-client'
        name: Build Linux module-backed Go sources
        working-directory: linux-client
        run: go build ./...
      - if: matrix.target == 'windows-agent'
        name: Download pinned FRP source for Agent analysis
        shell: pwsh
        run: |
          $frpCommit = 'fa3bcca2b0c4753cd4f0e2ab189dd6a5a6a15708'
          $archive = Join-Path $env:RUNNER_TEMP 'frp-source.zip'
          Invoke-WebRequest -UseBasicParsing -Headers @{
            'Accept' = 'application/vnd.github+json'
            'User-Agent' = 'HomeTunnelCodeQL'
            'X-GitHub-Api-Version' = '2022-11-28'
          } "https://api.github.com/repos/fatedier/frp/zipball/$frpCommit" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '9c6b0188a8f74e982069dc89218cc3d79bada8663cedf3b514b98847530cbf7d') {
            throw "Pinned FRP source checksum mismatch: $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP 'frp-source'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $root = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          if (-not $root -or -not (Test-Path -LiteralPath (Join-Path $root.FullName 'go.mod'))) {
            throw 'Pinned FRP source module not found'
          }
          $command = Join-Path $root.FullName 'cmd\home-tunnel-agent'
          New-Item -ItemType Directory -Force $command | Out-Null
          Copy-Item windows-agent\main.go, windows-agent\main_test.go $command
          "FRP_CODEQL_ROOT=$($root.FullName)" >> $env:GITHUB_ENV
      - if: matrix.target == 'windows-agent'
        name: Build Windows Agent under CodeQL
        shell: pwsh
        run: |
          Push-Location $env:FRP_CODEQL_ROOT
          try {
            $env:CGO_ENABLED = '0'
            $env:GOOS = 'windows'
            $env:GOARCH = 'amd64'
            $env:GOFLAGS = '-buildvcs=false'
            go test -count=1 ./cmd/home-tunnel-agent/
            if ($LASTEXITCODE -ne 0) { throw 'Agent tests failed' }
            go build ./cmd/home-tunnel-agent/
            if ($LASTEXITCODE -ne 0) { throw 'Agent build failed' }
          }
          finally { Pop-Location }
      - if: matrix.target == 'android-client'
        name: Build embedded Android Agent for Java/Kotlin analysis
        working-directory: android-client
        env:
          ANDROID_AGENT_ABIS: arm64-v8a,x86_64
        run: ./scripts/build-agent.sh
      - if: matrix.target == 'android-client'
        name: Build Android client under CodeQL
        working-directory: android-client
        # CodeQL must observe a real Kotlin/Java compilation. A fully restored
        # Gradle build cache can otherwise make the manual-build database empty.
        run: ./gradlew --no-daemon clean test lint assembleDebug --no-build-cache --rerun-tasks
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}/target:${{ matrix.target || 'default' }}"
