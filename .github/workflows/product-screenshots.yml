name: Product screenshot capture

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/product-screenshots.yml
      - docs/screenshots/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture released v10 Web UI with example data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out capture helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out unchanged v10.0.0 server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZHanry/home-tunnel-server
          ref: 9e5b4ff4e6381a42317c94618d1805b7398c558e
          path: capture-source/server
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: capture-source/server/control-center/pnpm-lock.yaml
      - name: Install locked preview and capture dependencies
        working-directory: capture-source/server/control-center
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium headless shell and required system fonts
        working-directory: capture-source/server/control-center
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          test -n "$(fc-list :lang=zh family)"
      - name: Capture genuine Web UI and record provenance
        run: node docs/screenshots/capture-product.mjs capture-source/server product-captures-v10
      - name: Upload screenshots for visual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-tunnel-v10-web-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-captures-v10/
          if-no-files-found: error
          retention-days: 14
