name: Product screenshot capture

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/product-screenshots.yml
      - docs/screenshots/**
      - scripts/capture-nestlink-views.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture selected Web UI with example data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out capture helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        name: Resolve selected source and version
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          candidate = json.loads(Path('distribution.json').read_text())['channels']['candidate']
          source = candidate['components']['server']['source_sha']
          if not isinstance(source, str) or not re.fullmatch(r'[a-f0-9]{40}', source):
              raise SystemExit('Select the exact committed server source before capture')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={source}\nversion={candidate['version']}\n")
          PY
      - name: Check out exact selected server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZHanry/home-tunnel-server
          ref: ${{ steps.source.outputs.sha }}
          path: capture-source/server
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: capture-source/server/control-center/pnpm-lock.yaml
      - name: Install locked preview and capture dependencies
        working-directory: capture-source/server/control-center
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium headless shell and required system fonts
        working-directory: capture-source/server/control-center
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          test -n "$(fc-list :lang=zh family)"
      - name: Capture genuine Web UI and record provenance
        env:
          CAPTURE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CAPTURE_PRODUCT_VERSION: ${{ steps.source.outputs.version }}
        run: node docs/screenshots/capture-product.mjs capture-source/server product-captures
      - name: Upload screenshots for visual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nestlink-web-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-captures/
          if-no-files-found: error
          retention-days: 14
