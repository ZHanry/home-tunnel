name: Migrate Android signing secrets once
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  transfer:
    if: github.actor == 'ZHanry'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
    - name: Install sealed-box encryption
      run: python3 -m pip install --disable-pip-version-check PyNaCl==1.6.2
    - name: Encrypt existing signing identity for the destination environment
      env:
        ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      run: |
        python3 - <<'PY'
        import base64, json, os
        from pathlib import Path
        from nacl.public import PublicKey, SealedBox
        public_key = PublicKey(base64.b64decode('DnnxQGhPDQ075C/LpUk3bFIPGf6SdZmt+jdD3t0vtUk='))
        names = ['ANDROID_RELEASE_KEYSTORE_BASE64', 'ANDROID_RELEASE_STORE_PASSWORD', 'ANDROID_RELEASE_KEY_ALIAS', 'ANDROID_RELEASE_KEY_PASSWORD']
        payload = {}
        for name in names:
            value = os.environ.get(name)
            if not value:
                raise SystemExit('Missing required signing secret: ' + name)
            payload[name] = {'encrypted_value': base64.b64encode(SealedBox(public_key).encrypt(value.encode())).decode(), 'key_id': '3380204578043523366'}
        Path('migration-encrypted.json').write_text(json.dumps(payload))
        print('Four signing values encrypted for home-tunnel-android; plaintext was not written.')
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-encrypted-migration
        path: migration-encrypted.json
        retention-days: 1
        if-no-files-found: error
