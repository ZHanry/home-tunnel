<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Home Tunnel</title>
  <script>
    (function () {
      var theme = "light";
      try {
        var stored = localStorage.getItem("ht_theme");
        if (stored === "dark" || stored === "light") theme = stored;
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      var locale = "zh-CN";
      try {
        var storedLocale = localStorage.getItem("ht_locale");
        if (storedLocale === "en" || storedLocale === "zh-CN") locale = storedLocale;
      } catch (e) {}
      document.documentElement.lang = locale;
    })();
  </script>
  <style>
    :root {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --bg: #f8fafc; --fg: #334155; --muted: #64748b; --card: #fff;
      --line: #e2e8f0; --input: #fff; --accent: #0284c7; --danger: #b91c1c;
      --danger-bg: #fef2f2; --secondary: #e2e8f0; --secondary-fg: #0f172a;
    }
    html[data-theme="dark"] {
      --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --card: #1e293b;
      --line: #334155; --input: #1e293b; --accent: #38bdf8; --danger: #fca5a5;
      --danger-bg: #451a1a; --secondary: #334155; --secondary-fg: #f8fafc;
    }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 640px; margin: 0 auto; padding: 20px 16px 0; }
    header h1 { margin: 0; font-size: 22px; }
    .toolbar { display: flex; gap: 8px; }
    main { max-width: 640px; margin: 0 auto; padding: 8px 16px 48px; }
    .muted { color: var(--muted); font-size: 14px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 13px; }
    input, select { width: 100%; box-sizing: border-box; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--input); color: var(--fg); }
    button { min-height: 40px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; padding: 8px 14px; }
    button.secondary { background: var(--secondary); color: var(--secondary-fg); }
    button.danger { background: var(--danger-bg); color: var(--danger); }
    button.chip { min-height: 28px; padding: 4px 8px; font-size: 12px; }
    button.icon { min-height: 36px; min-width: 36px; padding: 6px 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .card { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .url { color: var(--accent); font-family: ui-monospace, Consolas, monospace; cursor: pointer; word-break: break-all; }
    .error { color: var(--danger); min-height: 20px; }
    .hidden { display: none; }
    .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    #suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    a { color: var(--accent); }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
    .check input { width: auto; min-height: 0; }
    :root { --accent-fg: #fff; --accent: #0369a1; }
    html[data-theme="dark"] { --accent-fg: #0f172a; }
    * { box-sizing: border-box; }
    header, main { max-width: 860px; }
    header { padding-top: 28px; padding-bottom: 18px; }
    header h1 { font-size: 25px; letter-spacing: -.5px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin-top: 12px; }
    section#login { max-width: 500px; margin: 12px auto; }
    input, select, button { min-height: 44px; }
    button { color: var(--accent-fg); transition: background .15s; }
    button:disabled { opacity: .6; cursor: wait; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .password-field { display: flex; gap: 8px; }
    .password-field input { min-width: 0; }
    .password-field button { flex-shrink: 0; }
    .card { padding: 20px; }
    .card strong { font-size: 17px; }
    .url { display: block; width: 100%; text-align: left; margin: 14px 0 10px; font-size: 13px; color: var(--accent); background: var(--bg); padding: 12px; line-height: 1.6; }
    .card small { display: block; overflow-wrap: anywhere; color: var(--muted); line-height: 1.7; }
    .actions { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .error { line-height: 1.6; }
    @media(max-width:600px) { section { padding:18px; } input,select { font-size:16px; } }
    @media(prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <header>
    <h1>Home Tunnel</h1>
    <div class="toolbar">
      <button class="secondary icon" id="locale-toggle" type="button">EN</button>
      <button class="secondary icon" id="theme-toggle" type="button" aria-label="theme">◐</button>
    </div>
  </header>
  <main>
    <section id="login"><form id="login-form">
      <p class="muted" data-i18n="loginLead"></p>
      <label for="server" data-i18n="server"></label><input id="server" required autocomplete="url" inputmode="url" placeholder="https://console.example.com">
      <label for="username" data-i18n="username"></label><input id="username" required autocomplete="username">
      <label for="password" data-i18n="password"></label><div class="password-field"><input id="password" type="password" required autocomplete="current-password"><button id="show-password" class="secondary" type="button" data-i18n="showPassword"></button></div>
      <div id="password-change" class="hidden"><label for="new-password" data-i18n="newPassword"></label><input id="new-password" type="password" minlength="12" autocomplete="new-password"><label for="confirm-password" data-i18n="confirmPassword"></label><input id="confirm-password" type="password" minlength="12" autocomplete="new-password"></div>
      <p class="error" id="login-error" role="alert"></p>
      <div class="row">
        <button type="submit" id="login-button" data-i18n="login"></button>
        <button class="secondary" type="button" id="quit-login" data-i18n="quitApp"></button>
      </div>
    </form></section>
    <section id="home" class="hidden">
      <p class="muted" id="status" role="status"></p>
      <p class="muted" id="update"></p>
      <div class="row">
        <button id="refresh" data-i18n="sync"></button>
        <button class="secondary" id="add" data-i18n="add"></button>
        <button class="secondary" id="console" data-i18n="console"></button>
        <button class="danger" id="logout" data-i18n="logout"></button>
        <button class="secondary" id="quit-home" data-i18n="quitApp"></button>
      </div>
      <div id="connections"></div>
    </section>
    <section id="editor" class="hidden"><form id="editor-form">
      <h1 id="editor-title"></h1>
      <input id="edit-id" type="hidden">
      <label for="name" data-i18n="name"></label><input id="name" required>
      <label for="subdomain" data-i18n="subdomain"></label><input id="subdomain" required>
      <p class="muted" id="availability"></p>
      <div id="suggestions"></div>
      <label for="scheme" data-i18n="scheme"></label>
      <select id="scheme"><option value="http">http</option><option value="https">https</option></select>
      <label for="host" data-i18n="host"></label><input id="host" required value="127.0.0.1">
      <label for="port" data-i18n="port"></label><input id="port" value="8080" type="number" min="1" max="65535" required>
      <label class="check"><input id="enabled" type="checkbox" checked><span data-i18n="enabled"></span></label>
      <p class="error" id="edit-error" role="alert"></p>
      <div class="row">
        <button type="submit" id="save" data-i18n="save"></button>
        <button class="secondary" type="button" id="cancel" data-i18n="cancel"></button>
      </div>
    </form></section>
  </main>
  <script src="/desktop.js" defer></script>

</body>
</html>
