# 通用 TCP 隧道默认关闭。它可承载 RTSP-over-TCP、SSH、RDP、MQTT、
# 数据库等任意 TCP 字节流。管理员确认端口范围和主机防火墙后显式叠加：
# Portable root profile:
# docker compose -f compose.yaml -f deploy/compose.tcp.yaml up -d
# ARM64 deploy profile (from deploy/):
# docker compose -f compose.yaml -f compose.tcp.yaml up -d
# 必须在 .env 里显式设置 HOME_TUNNEL_TCP_PORT_START/END；未设置会失败。
# 未指定绑定地址时默认 127.0.0.1，避免无意把端口打到 0.0.0.0。
services:
  control-center:
    environment:
      TCP_TUNNEL_ENABLED: "true"
      TCP_PORT_START: "${HOME_TUNNEL_TCP_PORT_START:?HOME_TUNNEL_TCP_PORT_START_required}"
      TCP_PORT_END: "${HOME_TUNNEL_TCP_PORT_END:?HOME_TUNNEL_TCP_PORT_END_required}"

  frps:
    environment:
      PUBLIC_FRPS_PORT: "${HOME_TUNNEL_FRPS_PORT:-7000}"
      TCP_TUNNEL_ENABLED: "true"
      TCP_PORT_START: "${HOME_TUNNEL_TCP_PORT_START:?HOME_TUNNEL_TCP_PORT_START_required}"
      TCP_PORT_END: "${HOME_TUNNEL_TCP_PORT_END:?HOME_TUNNEL_TCP_PORT_END_required}"
    ports:
      - "${HOME_TUNNEL_TCP_BIND_ADDRESS:-127.0.0.1}:${HOME_TUNNEL_TCP_PORT_START:?HOME_TUNNEL_TCP_PORT_START_required}-${HOME_TUNNEL_TCP_PORT_END:?HOME_TUNNEL_TCP_PORT_END_required}:${HOME_TUNNEL_TCP_PORT_START:?HOME_TUNNEL_TCP_PORT_START_required}-${HOME_TUNNEL_TCP_PORT_END:?HOME_TUNNEL_TCP_PORT_END_required}/tcp"
