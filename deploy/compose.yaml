name: home-tunnel

x-logging: &logging
  driver: local
  options: { max-size: 5m, max-file: "3" }

services:
  control-center:
    image: home-tunnel/control-center:3.1.0-rc.1-arm64
    pull_policy: never
    container_name: home-tunnel-control-center
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160 --disable-warning=ExperimentalWarning
      PORT: "8080"
      PUBLIC_BASE_URL: ${HOME_TUNNEL_PUBLIC_BASE_URL:?set HOME_TUNNEL_PUBLIC_BASE_URL}
      DOWNLOADS_DIRECTORY: /app/downloads
      SQLITE_PATH: /data/home-tunnel.db
      TUNNEL_DOMAIN: ${HOME_TUNNEL_TUNNEL_DOMAIN:?set HOME_TUNNEL_TUNNEL_DOMAIN}
      PUBLIC_FRPS_HOST: ${HOME_TUNNEL_FRPS_PUBLIC_HOST:?set HOME_TUNNEL_FRPS_PUBLIC_HOST}
      PUBLIC_FRPS_PORT: ${HOME_TUNNEL_FRPS_PORT:-7000}
      COOKIE_SECURE: "true"
      PASSWORD_HASH_CONCURRENCY: "1"
      PASSWORD_HASH_QUEUE_MAX: "32"
      INTERNAL_SERVICE_KEY_FILE: /run/secrets/internal_service_key
      FRPS_PLUGIN_KEY_FILE: /run/secrets/frps_plugin_key
      LEASE_SIGNING_KEY_FILE: /run/secrets/lease_signing_key
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      FRPS_TLS_CERT_FILE: /run/secrets/frps_tls_cert
      BOOTSTRAP_ADMIN_USERNAME: ${HOME_TUNNEL_BOOTSTRAP_ADMIN_USERNAME:-admin}
      ACCESS_TOKEN_SECONDS: "900"
      REFRESH_TOKEN_SECONDS: "2592000"
      ONLINE_LEASE_SECONDS: "86400"
      OFFLINE_LEASE_MAX_SECONDS: "86400"
      POLICY_SNAPSHOT_SECONDS: "86400"
      GATEWAY_HEALTH_URL: http://home-tunnel-traffic-gateway:8080/healthz
      FRPS_HOST: home-tunnel-frps
      FRPS_PORT: "7000"
      CADDY_HOST: ${HOME_TUNNEL_CADDY_HOST:-caddy}
      CADDY_PORT: "80"
      BACKUP_STATUS_FILE: /run/home-tunnel-status/backup.json
      ALERT_WEBHOOK_URL: ${HOME_TUNNEL_ALERT_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${HOME_TUNNEL_ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${HOME_TUNNEL_ALERT_TELEGRAM_CHAT_ID:-}
    secrets:
      - internal_service_key
      - frps_plugin_key
      - lease_signing_key
      - bootstrap_admin_password
      - frps_tls_cert
    volumes:
      - sqlite-data:/data
      - ./status:/run/home-tunnel-status:ro
      - ./downloads:/app/downloads:ro
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 320m
    cpus: "0.50"
    pids_limit: 96
    stop_grace_period: 20s
    logging: *logging

  traffic-gateway:
    image: home-tunnel/traffic-gateway:3.1.0-rc.1-arm64
    pull_policy: never
    container_name: home-tunnel-traffic-gateway
    restart: unless-stopped
    init: true
    depends_on:
      control-center: { condition: service_healthy }
      frps: { condition: service_started }
    environment:
      NODE_OPTIONS: --max-old-space-size=96
      PORT: "8080"
      CONTROL_CENTER_URL: http://home-tunnel-control-center:8080
      FRPS_VHOST_HOST: home-tunnel-frps
      FRPS_VHOST_PORT: "8080"
      INTERNAL_SERVICE_KEY_FILE: /run/secrets/internal_service_key
      POLICY_FULL_SYNC_MS: "300000"
      POLICY_RECONNECT_MS: "3000"
      SAMPLE_BUCKET_SECONDS: "60"
    secrets:
      - internal_service_key
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz',{headers:{host:'127.0.0.1:8080'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 160m
    cpus: "0.35"
    pids_limit: 96
    stop_grace_period: 20s
    logging: *logging

  frps:
    image: home-tunnel/frps:0.70.1-arm64
    pull_policy: never
    container_name: home-tunnel-frps
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_FRPS_PORT: "${HOME_TUNNEL_FRPS_PORT:-7000}"
    depends_on:
      control-center: { condition: service_healthy }
    ports:
      - "${HOME_TUNNEL_FRPS_BIND_ADDRESS:-0.0.0.0}:${HOME_TUNNEL_FRPS_PORT:-7000}:7000/tcp"
    secrets:
      - frps_plugin_key
      - frps_tls_cert
      - frps_tls_key
    tmpfs:
      - /run/frp:size=8m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
      - /tmp:size=8m,noexec,nosuid,nodev
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 7000"]
      interval: 30s
      start_interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 96
    stop_grace_period: 20s
    logging: *logging

volumes:
  sqlite-data:
    name: home-tunnel-sqlite-data

networks:
  control:
    name: home-tunnel-control
    internal: true
  edge:
    name: home-tunnel-edge
    external: true

secrets:
  internal_service_key:
    file: ./secrets/internal_service_key
  frps_plugin_key:
    file: ./secrets/frps_plugin_key
  lease_signing_key:
    file: ./secrets/lease_signing_key
  bootstrap_admin_password:
    file: ./secrets/bootstrap_admin_password
  frps_tls_cert:
    file: ./secrets/frps_tls_cert.pem
  frps_tls_key:
    file: ./secrets/frps_tls_key.pem
