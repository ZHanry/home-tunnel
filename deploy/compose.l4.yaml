# 同时启用通用 TCP 与固定端口 UDP 隧道。两种传输共用端口数字范围，
# 但 TCP/UDP 是独立的网络命名空间；务必同步限制两种协议的主机防火墙。
# Portable root profile:
# docker compose -f compose.yaml -f deploy/compose.l4.yaml up -d
# ARM64 deploy profile (from deploy/):
# docker compose -f compose.yaml -f compose.l4.yaml up -d
# 必须在 .env 里显式设置 HOME_TUNNEL_L4_PORT_START/END；未设置会失败。
# 未指定绑定地址时默认 127.0.0.1，避免无意把端口打到 0.0.0.0。
services:
  control-center:
    environment:
      L4_TUNNEL_ENABLED: "true"
      L4_PORT_START: "${HOME_TUNNEL_L4_PORT_START:?HOME_TUNNEL_L4_PORT_START_required}"
      L4_PORT_END: "${HOME_TUNNEL_L4_PORT_END:?HOME_TUNNEL_L4_PORT_END_required}"

  frps:
    environment:
      PUBLIC_FRPS_PORT: "${HOME_TUNNEL_FRPS_PORT:-7000}"
      L4_TUNNEL_ENABLED: "true"
      L4_PORT_START: "${HOME_TUNNEL_L4_PORT_START:?HOME_TUNNEL_L4_PORT_START_required}"
      L4_PORT_END: "${HOME_TUNNEL_L4_PORT_END:?HOME_TUNNEL_L4_PORT_END_required}"
    ports:
      - "${HOME_TUNNEL_L4_BIND_ADDRESS:-127.0.0.1}:${HOME_TUNNEL_L4_PORT_START:?HOME_TUNNEL_L4_PORT_START_required}-${HOME_TUNNEL_L4_PORT_END:?HOME_TUNNEL_L4_PORT_END_required}:${HOME_TUNNEL_L4_PORT_START:?HOME_TUNNEL_L4_PORT_START_required}-${HOME_TUNNEL_L4_PORT_END:?HOME_TUNNEL_L4_PORT_END_required}/tcp"
      - "${HOME_TUNNEL_L4_BIND_ADDRESS:-127.0.0.1}:${HOME_TUNNEL_L4_PORT_START:?HOME_TUNNEL_L4_PORT_START_required}-${HOME_TUNNEL_L4_PORT_END:?HOME_TUNNEL_L4_PORT_END_required}:${HOME_TUNNEL_L4_PORT_START:?HOME_TUNNEL_L4_PORT_START_required}-${HOME_TUNNEL_L4_PORT_END:?HOME_TUNNEL_L4_PORT_END_required}/udp"
