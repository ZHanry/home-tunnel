<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
    body { position: relative; color: #f8fafc; background: radial-gradient(circle at 82% 15%, rgba(101,231,212,.22), transparent 300px), radial-gradient(circle at 10% 0%, rgba(84,168,255,.25), transparent 360px), #07111f; font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
    .grid { position: absolute; inset: 0; opacity: .08; background-image: linear-gradient(#65e7d4 1px, transparent 1px), linear-gradient(90deg, #65e7d4 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(to right, #000, transparent 70%); }
    main { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 620px 1fr; align-items: center; gap: 52px; padding: 64px 72px; }
    .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 38px; font-size: 25px; font-weight: 800; }
    .brand img { width: 58px; height: 58px; border-radius: 14px; }
    .eyebrow { margin: 0 0 12px; color: #65e7d4; font-size: 17px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 560px; font-size: 61px; line-height: 1.12; letter-spacing: -.04em; }
    p { max-width: 570px; margin: 25px 0 0; color: #c3d0df; font-size: 23px; line-height: 1.55; }
    .chips { display: flex; gap: 12px; margin-top: 28px; }
    .chip { padding: 8px 14px; border: 1px solid #28405a; border-radius: 999px; color: #d8e5f3; background: rgba(13,27,45,.8); font-size: 16px; font-weight: 700; }
    .shot { overflow: hidden; border: 1px solid #466682; border-radius: 22px; background: #fff; box-shadow: 0 30px 90px rgba(0,0,0,.48); transform: rotate(-1.2deg); }
    .shot img { display: block; width: 720px; height: auto; }
    .badge { position: absolute; right: 74px; bottom: 58px; padding: 11px 18px; border-radius: 12px; color: #07111f; background: #65e7d4; font-size: 18px; font-weight: 900; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main>
    <section>
      <div class="brand"><img src="../../site/assets/HomeTunnel.svg" alt=""><span>Home Tunnel</span></div>
      <p class="eyebrow">Self-hosted tunnels for home services</p>
      <h1>把家里的服务，安全地带到公网。</h1>
      <p>可审计 · 可限速 · 可随时撤销<br>安全发布 NAS、Home Assistant 与开发服务</p>
      <div class="chips"><span class="chip">Apache-2.0</span><span class="chip">Linux amd64 / arm64</span><span class="chip">No public demo</span></div>
    </section>
    <div class="shot"><img src="../screenshots/admin-dashboard.jpg" alt=""></div>
    <div class="badge">github.com/ZHanry/home-tunnel</div>
  </main>
</body>
</html>
